<!--
  IPPO CODING — SALTO AD OSTACOLI. Coding in un ippodromo medievale con i cavalieri delle quattro casate
  (TassoRosso, AquilaBlu, CeroGiallo, QuerciaVerde). Quinto gioco della serie dopo Controcorrente, Rocca Cifrata,
  Il Fontaniere e Coach!. Progettazione A. Cerioli, novembre 2026.
  Design: _lavoro/2026-11-19-ippo-coding-design.md. Scheda docenti: ippo-docenti.html.
  ------------------------------------------------------------------
  - Otto percorsi (gradi: Stalliere ... Campione), dieci livelli ciascuno, per tutti dalla 1ª primaria alla 3ª
    secondaria: si parte dal grado 1, non dalla propria classe. La forma del codice cresce di grado in grado:
    tessere-icona (1-2), mattoncini (3-6), Python (6-8). Scaffolding: Usa, Modifica, Crea.
  - Un file solo, HTML/CSS/JS vanilla. Unica dipendenza esterna: Google Fonts. Immagini in img/, musiche in audio/.
  - Motore puro, senza DOM, fra CORE-START e CORE-END: lo verifica in Node _lavoro/test_core.mjs.
    Livelli fra LEVELS-START e LEVELS-END: li verifica _lavoro/test_livelli.mjs (soluzioni, par, 500 piste a sorpresa).
  - Mai localStorage (Mac di laboratorio condivisi). Progressi per classe e Mac su un foglio Google della scuola
    (REGISTRO_URL, _lavoro/apps-script/ippo.gs), ripresa nella scheda con sessionStorage, codice gara di riserva.
  - Docente: cinque tocchi sul logo. Link: ?percorso=N&livello=M, ?seed=, ?musica=0, ?suoni=0, ?registro=0.
  - Blu istituzionale #123E90 (le casate sono della scuola), legno e pergamena. Errori in ambra, mai in rosso;
    oro solo per il merito. Il rosso compare soltanto come colore di TassoRosso. Nessuna emoji: solo SVG inline.

  NOTE TECNICHE (soluzioni riusabili)
  - Tre editor, un albero: tessere, mattoncini e testo producono lo stesso albero di nodi; il motore non sa da
    dove arriva. Tessere e mattoncini sono lo stesso editor con due «pelli» CSS (data-pelle).
  - Il parser è una discesa ricorsiva riga per riga con pila dei rientri: accetta tab e rientri coerenti di
    qualunque ampiezza, e ogni errore porta riga e consiglio in italiano (parola più vicina con Levenshtein).
  - esegui() non anima: restituisce fotogrammi, ognuno con mattoncino e riga che l'hanno prodotto. Da lì nascono
    animazione, evidenziazione e passo-passo. Un limite di 600 passi trasforma i cicli infiniti in «stallo».
  - Il giudice delle manche a sorpresa: 24 piste generate da un seme, il programma le corre tutte e viene mostrata
    la peggiore per quel programma. L'errore è sempre un controesempio concreto.
  - Cavalieri e ostacoli scontornati in locale con Vision di macOS: _lavoro/asset/cutout.swift.
  - Schermata nascosta = misure a zero: dopo mostra() si aspetta un doppio requestAnimationFrame prima di
    montare il campo; un ResizeObserver lo ridisegna a ogni cambio di misura.
  - Trascinamento con Pointer Events su window (da Controcorrente e Coach!), tocco per aggiungere, buchi che si
    riempiono per primi nei livelli «Completa».
  - Tutta l'interfaccia è in rem e la dimensione di base segue la finestra: 16 px a 1920x1080.
-->

<style>
:root{

}
[data-casata="aquila"]{--casa:#2F5FB8;--casa-scuro:#123E90;--casa-chiaro:#E1E9F8;--casa-testo:#FFFFFF}
[data-casata="tasso"]{--casa:#C0293B;--casa-scuro:#8E1426;--casa-chiaro:#FBE4E6;--casa-testo:#FFFFFF}
[data-casata="cero"]{--casa:#D9A21B;--casa-scuro:#8A6400;--casa-chiaro:#FBF0CF;--casa-testo:#2A2100}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* tutta l'interfaccia è in rem: la dimensione di base segue la finestra (16 px su un monitor 1920x1080) */
html{font-size:clamp(11.5px,min(.835vw,1.48vh),20px);height:100%}
body{height:100%;font-family:var(--f-body);background:var(--legno-notte);color:var(--inchiostro);overflow:hidden;font-size:1rem;line-height:1.35;-webkit-user-select:none;user-select:none}
h1,h2,h3,h4,.display{font-family:var(--f-display);font-weight:700;line-height:1.1}
button{font-family:var(--f-display);font-size:1rem;cursor:pointer;border:none;color:inherit;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:.2rem solid var(--oro);outline-offset:.12rem}
[hidden]{display:none !important}

/* ---------- pulsanti */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;padding:.5em 1.15em;border-radius:var(--r-m);font-weight:700;font-size:1.15rem;letter-spacing:.02em;color:#fff;background:var(--blu-medio);box-shadow:0 .28em 0 var(--blu),0 .5em .8em rgba(0,0,0,.22);transition:transform .12s,box-shadow .12s,filter .15s;white-space:nowrap}

.btn:disabled{filter:grayscale(.7) opacity(.55);cursor:default;transform:none}
.btn.verde{background:linear-gradient(#3DAA60,#2F8F4E);box-shadow:0 .28em 0 var(--verde-scuro),0 .5em .8em rgba(0,0,0,.22)}
.btn.ambra{background:linear-gradient(#D98E3A,#B96D1C);box-shadow:0 .28em 0 var(--ambra-scuro),0 .5em .8em rgba(0,0,0,.22)}
.btn.oro{background:linear-gradient(#F3C440,#E0A91B);color:#3A2A00;box-shadow:0 .28em 0 var(--oro-scuro),0 .5em .8em rgba(0,0,0,.22)}
.btn.legno{background:linear-gradient(#B07A40,#8A5A2B);box-shadow:0 .28em 0 var(--legno-scuro),0 .5em .8em rgba(0,0,0,.28);border:.12em solid var(--legno-luce)}

.btn.piccolo{font-size:.95rem;padding:.38em .85em}
.btn.grande{font-size:1.9rem;padding:.45em 1.6em;border-radius:1.2rem}

.tondo:hover{background:rgba(255,255,255,.26)}
.tondo:active{transform:scale(.94)}
.tondo.spento{opacity:.5}
.tondo .ico{width:1.5rem;height:1.5rem}

/* ---------- barra in alto */
#barra{position:relative;z-index:var(--z-hud);flex:none;height:4rem;display:flex;align-items:center;gap:.9rem;padding:0 1rem;background:linear-gradient(var(--blu),var(--blu-notte));color:#fff;border-bottom:.3rem solid var(--casa);box-shadow:0 .2rem .8rem rgba(0,0,0,.35)}

.su-carta .stella.si{color:var(--oro)}

/* ---------- titolo */
#s-titolo .zona-logo{position:absolute;left:28%;top:4%;width:44%;height:42%;border-radius:2rem}
.titolo-basso{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:1rem;padding:5rem 1rem 1.2rem;background:linear-gradient(180deg,transparent,rgba(11,20,40,.72) 55%)}
.crediti{color:#fff;font-size:.9rem;text-align:center;opacity:.92;text-shadow:0 1px 3px rgba(0,0,0,.7)}

/* ---------- pergamena e cornici di legno */
.pergamena{background:radial-gradient(120% 90% at 50% 0%,#FFF8E4,var(--carta) 55%,var(--carta-ombra));border:.16rem solid var(--carta-bordo);border-radius:var(--r-m);box-shadow:var(--ombra-1)}
.cornice{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;border-radius:1.1rem;padding:.75rem;background:repeating-linear-gradient(92deg,rgba(0,0,0,.05) 0 .2rem,transparent .2rem .9rem),linear-gradient(#A8733C,#7C4F24);border:.2rem solid var(--legno-notte);box-shadow:inset 0 .12rem 0 rgba(255,255,255,.28),inset 0 -.2rem 0 rgba(0,0,0,.25),var(--ombra-2)}

.cornice::before{left:.3rem}.cornice::after{right:.3rem}

/* ---------- chi sei */
.ov{position:absolute;inset:0;z-index:var(--z-overlay);display:flex;align-items:center;justify-content:center;padding:1.5rem;background:rgba(11,16,30,.72);animation:appare .25s ease both}
@keyframes appare{from{opacity:0}}
.ov > .scheda{max-width:min(96vw,74rem);max-height:94vh;overflow:auto;padding:1.6rem 2rem;animation:sale .35s var(--molla) both}
@keyframes sale{from{transform:translateY(1.5rem) scale(.97);opacity:0}}
.scheda h2{font-size:2.1rem;color:var(--blu)}
.scheda p{font-size:1.1rem;margin:.35rem 0}
#ov-chi{background:none}
#ov-chi .scheda{width:min(96vw,70rem)}
.chi-et{font-family:var(--f-display);font-weight:700;font-size:1.1rem;color:var(--blu);margin:.8rem 0 .35rem}
.chi-classi{display:grid;grid-template-columns:6.5rem repeat(10,1fr);gap:.4rem;align-items:center}
.chi-classi .ordine{font-family:var(--f-display);font-weight:700;color:var(--inchiostro-soft)}
.chi-classi button{padding:.35rem 0;border-radius:.6rem;background:#fff;border:.14rem solid var(--carta-bordo);font-weight:700;font-size:1.1rem;color:var(--inchiostro)}
.chi-classi button.si{background:var(--blu);border-color:var(--blu-notte);color:#fff}
.chi-macs{display:grid;gap:.35rem}
.chi-fila{position:relative;display:grid;grid-template-columns:8.5rem repeat(7,1fr);gap:.5rem;align-items:center;padding:.25rem .6rem .15rem 0;border-radius:.6rem;overflow:hidden}
.chi-fila::before{content:"";position:absolute;inset:0;background:var(--fila);opacity:.16}
.chi-fila > *{position:relative}
.chi-casa{align-self:stretch;margin:-.25rem 0 -.15rem;display:flex;align-items:center;justify-content:center;background:var(--fila);color:var(--fila-t);font-family:var(--f-display);font-weight:800;font-size:1.05rem}
.chi-mac{line-height:0;border-radius:.5rem;transition:transform .12s,opacity .15s}
.chi-mac svg{width:100%;height:auto;max-height:4.6rem;overflow:visible}
.chi-mac .im-corpo{fill:#10141C;stroke:#7E8898;stroke-width:2.5}
.chi-mac .im-schermo{fill:var(--fila)}
.chi-mac .im-mento{fill:#B3BAC5}.chi-mac .im-piede{fill:#8B94A3}.chi-mac .im-base{fill:#9AA3B1}
.chi-mac .im-num{fill:var(--fila-t);font:800 38px var(--f-display)}
.chi-mac:hover{transform:translateY(-.15rem)}
.chi-macs.scelto .chi-mac:not(.si){opacity:.4}
.chi-mac.si{transform:scale(1.1)}
.chi-mac.si .im-corpo{stroke:var(--oro);stroke-width:6}
.chi-basso{display:flex;align-items:center;gap:.8rem;margin-top:1rem}
.chi-basso .msg{flex:1;font-size:1.05rem;color:var(--inchiostro-soft)}
.chi-volti{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin:1rem 0}
.chi-volto{display:flex;flex-direction:column;align-items:center;gap:.4rem;padding:.6rem;border-radius:1rem;background:#fff;border:.2rem solid var(--carta-bordo);font-weight:700;font-size:1.1rem;color:var(--inchiostro);transition:transform .15s}
.chi-volto img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:.7rem}
.chi-volto:hover{transform:translateY(-.25rem)}
.chi-volto.si{border-color:var(--v);box-shadow:0 0 0 .2rem var(--v)}

/* ---------- castello: gli otto stendardi */
#s-castello .corpo,#s-stalla .corpo{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;padding:1.2rem 1.5rem}
.intesta{color:#fff;text-align:center;text-shadow:0 .15rem .5rem rgba(0,0,0,.75)}
.intesta h1{font-size:2.6rem}
.intesta p{font-size:1.2rem;max-width:60rem}
.stendardi{display:grid;grid-template-columns:repeat(8,1fr);gap:.9rem;width:min(100%,104rem);align-items:start}
.stendardo{position:relative;display:flex;flex-direction:column;align-items:center;gap:.3rem;padding:1.5rem .5rem 3rem;color:#fff;text-align:center;background:linear-gradient(var(--tinta),var(--tinta-s));clip-path:polygon(0 0,100% 0,100% 100%,50% 86%,0 100%);filter:drop-shadow(0 .5rem .7rem rgba(0,0,0,.45));transition:transform .2s var(--molla)}

.stendardo .conto .stella{width:1.15rem;height:1.15rem;color:var(--oro)}

.stendardo .tuo-l{order:-1;margin:-.3rem 0 .1rem;padding:.05rem .7rem;border-radius:1rem;background:var(--oro);color:#3A2A00;font-size:.82rem;font-weight:700;white-space:nowrap;box-shadow:0 .1rem .3rem rgba(0,0,0,.4)}
.stendardi{margin-bottom:.6rem}
.riga-codice{display:flex;align-items:center;gap:.6rem;padding:.6rem 1rem}

.riga-codice .esito{font-size:1rem;color:var(--ambra-scuro);min-width:10rem}

/* ---------- stalla: le dieci targhe */
.stalla-su{display:flex;align-items:center;gap:1.2rem;width:min(100%,86rem)}
.stalla-su img{width:7rem;height:7rem;border-radius:50%;border:.3rem solid var(--casa);object-fit:cover;box-shadow:var(--ombra-1);flex:none}
.fumetto{position:relative;flex:1;padding:.9rem 1.3rem;font-size:1.2rem}
.fumetto::before{content:"";position:absolute;left:-.75rem;top:50%;width:1.4rem;height:1.4rem;background:var(--carta);border-left:.16rem solid var(--carta-bordo);border-bottom:.16rem solid var(--carta-bordo);transform:translateY(-50%) rotate(45deg)}
.fumetto h2{font-size:1.7rem;color:var(--blu);margin-bottom:.15rem}
.targhe{display:grid;grid-template-columns:repeat(5,1fr);gap:1rem;width:min(100%,86rem)}
.targa-l{position:relative;display:flex;flex-direction:column;align-items:center;gap:.25rem;padding:.8rem .6rem .7rem;border-radius:1rem;color:var(--inchiostro);text-align:center;background:radial-gradient(120% 90% at 50% 0%,#FFF8E4,var(--carta) 60%,var(--carta-ombra));border:.28rem solid var(--legno);box-shadow:0 .3rem 0 var(--legno-scuro),0 .7rem 1.2rem rgba(0,0,0,.4);transition:transform .15s var(--molla)}
.targa-l:hover:not(.chiusa){transform:translateY(-.3rem)}
.targa-l .num{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1;color:var(--blu)}
.targa-l .nome{font-family:var(--f-display);font-weight:700;font-size:1.1rem;line-height:1.1;min-height:2.4em;display:flex;align-items:center}
.targa-l .tipo{display:inline-flex;align-items:center;gap:.3rem;font-size:.82rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--inchiostro-soft)}
.targa-l.chiusa{filter:grayscale(.55) brightness(.82);cursor:default}
.targa-l.chiusa .num{color:var(--inchiostro-soft)}
.targa-l .lucchetto{position:absolute;top:.5rem;right:.5rem;width:1.3rem;height:1.3rem;color:var(--inchiostro-soft)}
.targa-l.prova{border-color:var(--oro-scuro);box-shadow:0 .3rem 0 #6E5005,0 .7rem 1.2rem rgba(0,0,0,.4)}
.fasi{display:grid;grid-template-columns:2fr 4fr 4fr;gap:1rem;width:min(100%,86rem);color:#fff;font-family:var(--f-display);font-weight:700;font-size:1rem;text-align:center;text-shadow:0 .1rem .3rem rgba(0,0,0,.8)}
.fasi span{border-top:.2rem solid rgba(255,255,255,.7);padding-top:.2rem}
.targhe.a-fasi{grid-template-columns:repeat(10,1fr)}

/* ---------- gara: disposizione generale */
#s-gara{background:linear-gradient(#3F6FB5,#274B86)}
.gara{flex:1;min-height:0;display:grid;gap:1.4rem;padding:1.7rem 1.2rem .6rem;grid-template-columns:minmax(26rem,43fr) 57fr}
[data-disp="A"] .gara{grid-template-columns:1fr;grid-template-rows:minmax(0,58fr) minmax(0,42fr)}
[data-disp="A"] #p-campo{order:1}
[data-disp="A"] #p-codice{order:2}
#messaggio{flex:none;min-height:3.6rem;display:flex;align-items:center;gap:.8rem;padding:.4rem 1.2rem .6rem;color:#fff;font-size:1.15rem}
#messaggio .testo{flex:1;padding:.5rem 1rem;border-radius:.8rem;background:rgba(11,37,89,.55);border-left:.4rem solid var(--blu-chiaro);min-height:2.6rem;display:flex;align-items:center;gap:.6rem}
#messaggio[data-tono="ambra"] .testo{background:var(--ambra-chiaro);color:#4A2B05;border-left-color:var(--ambra)}
#messaggio[data-tono="verde"] .testo{background:var(--verde-chiaro);color:#123E22;border-left-color:var(--verde)}
#messaggio[data-tono="oro"] .testo{background:var(--oro-chiaro);color:#3A2A00;border-left-color:var(--oro)}
#messaggio .testo b{font-family:var(--f-display)}
#messaggio .seme{font:500 .8rem var(--f-mono);opacity:.75;white-space:nowrap}

/* ---------- pannello del codice */
#p-codice .dentro{flex-direction:row}
.rotaia{flex:none;width:5.6rem;display:flex;flex-direction:column;gap:.3rem;padding:.6rem .3rem;background:var(--carta-ombra);border-right:.12rem solid var(--carta-bordo);overflow:auto}
.rotaia button{display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.35rem .1rem;border-radius:.6rem;font-size:.72rem;font-weight:700;letter-spacing:.03em;color:var(--c);text-transform:uppercase}
.rotaia button .bollo{width:2.5rem;height:2.5rem;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--c);color:#fff;box-shadow:0 .15rem 0 rgba(0,0,0,.25)}
.rotaia button.si{background:#fff;box-shadow:inset 0 0 0 .12rem var(--c)}
.rotaia button.vuota{opacity:.3;cursor:default}
.cassetto{flex:none;width:15.5rem;display:flex;flex-direction:column;gap:.5rem;padding:.7rem .6rem;border-right:.12rem dashed var(--carta-bordo);overflow:auto}
.cassetto h4{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--inchiostro-soft);margin-top:.2rem}
.cassetto .blocco{flex-wrap:wrap;row-gap:.2rem}
.cassetto .blocco.cont{min-width:0;width:100%}
.cassetto .testa-c{flex-wrap:wrap;row-gap:.2rem}
.cassetto .corpo{min-height:1.4rem}
.area-prog{flex:1;min-width:0;display:flex;flex-direction:column}
#programma{flex:1;min-height:0;overflow:auto;padding:.7rem .7rem 2rem;display:flex;flex-direction:column;align-items:flex-start;gap:.3rem}
.zaino{flex:none;display:flex;align-items:center;gap:.5rem;padding:.3rem .7rem;font-size:.92rem;color:var(--inchiostro-soft);border-top:.12rem solid var(--carta-bordo);background:rgba(255,255,255,.4)}
.zaino b{font-family:var(--f-display);font-size:1.1rem;color:var(--inchiostro)}
.zaino.ok b:first-of-type{color:var(--verde-scuro)}
.zaino.oltre b:first-of-type{color:var(--ambra-scuro)}
.zaino .spazio{flex:1}
.comandi{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem;padding:.6rem .1rem 0}
.comandi .spazio{flex:1}
.velocita{display:flex;align-items:center;gap:.15rem;padding:.2rem;border-radius:.7rem;background:rgba(0,0,0,.25)}
.velocita button{padding:.2rem .55rem;border-radius:.5rem;color:#fff;font-weight:700;font-size:.95rem;opacity:.75}
.velocita button.si{background:var(--carta);color:var(--inchiostro);opacity:1}

/* ---------- mattoncini */
.blocco{--c:var(--c-mov);position:relative;display:inline-flex;align-items:center;gap:.45rem;min-height:2.5rem;padding:.3rem .7rem .3rem .55rem;border-radius:.65rem;background:var(--c);color:#fff;font-family:var(--f-display);font-weight:700;font-size:1.02rem;line-height:1.1;box-shadow:inset 0 -.2rem 0 rgba(0,0,0,.22),inset 0 .1rem 0 rgba(255,255,255,.25),0 .12rem .25rem rgba(0,0,0,.2);cursor:grab;touch-action:none;max-width:100%}
.blocco .ico{width:1.35rem;height:1.35rem}
.blocco.salti{--c:var(--c-salti)}.blocco.cicli{--c:var(--c-cicli)}.blocco.ctrl{--c:var(--c-ctrl)}.blocco.var{--c:var(--c-var)}
.blocco.cappello{--c:var(--c-capo);border-radius:1.2rem .65rem .65rem .65rem;cursor:default;padding-right:1rem}
.blocco.cont{display:flex;flex-direction:column;align-items:stretch;gap:0;padding:0;background:none;box-shadow:none;min-width:13rem}
.testa-c,.piede-c,.mezzo-c{display:flex;align-items:center;gap:.45rem;min-height:2.5rem;padding:.3rem .7rem .3rem .55rem;background:var(--c);color:#fff;box-shadow:inset 0 .1rem 0 rgba(255,255,255,.25)}
.testa-c{border-radius:.65rem .65rem .65rem 0}
.mezzo-c{border-radius:0 .65rem .65rem 0;min-height:2rem}
.piede-c{min-height:.9rem;padding:0;border-radius:0 .65rem .65rem .65rem;width:60%;box-shadow:inset 0 -.2rem 0 rgba(0,0,0,.22)}
.corpo{display:flex;flex-direction:column;align-items:flex-start;gap:.3rem;min-height:2.6rem;padding:.35rem .3rem .35rem .55rem;border-left:.75rem solid var(--c)}
.corpo.drop-attivo,#programma.drop-attivo{background:rgba(224,169,27,.16)}
.pill{display:inline-flex;align-items:center;gap:.3rem;padding:.12rem .6rem;border-radius:1rem;background:#fff;color:var(--inchiostro);font-family:var(--f-display);font-weight:700;font-size:.98rem;box-shadow:inset 0 -.12rem 0 rgba(0,0,0,.14);cursor:pointer;white-space:nowrap}
.pill .freccia{width:.7rem;height:.7rem;opacity:.6}
.pill.buco{background:var(--oro-chiaro);color:var(--ambra-scuro);animation:pulsa 1.2s ease-in-out infinite}
.contan{display:inline-flex;align-items:center;border-radius:1rem;background:#fff;color:var(--inchiostro);overflow:hidden;box-shadow:inset 0 -.12rem 0 rgba(0,0,0,.14)}
.contan button{width:1.6rem;height:1.75rem;font-weight:800;font-size:1.1rem;color:var(--c)}
.contan button:hover{background:rgba(0,0,0,.08)}
.contan .conto{min-width:1.5rem;text-align:center;font-weight:800;font-size:1.05rem}
.contan.buco{background:var(--oro-chiaro);animation:pulsa 1.2s ease-in-out infinite}
.blocco .x{margin-left:.2rem;width:1.3rem;height:1.3rem;border-radius:50%;background:rgba(0,0,0,.22);color:#fff;font-size:.95rem;line-height:1;display:inline-flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.blocco:hover > .x,.testa-c:hover > .x,.blocco:focus-within > .x{opacity:1}
@media (hover:none){.blocco .x{opacity:.85}}
.blocco .giro,.blocco .esito{margin-left:auto;padding:.05rem .5rem;border-radius:1rem;background:rgba(255,255,255,.92);color:var(--inchiostro);font-size:.82rem;font-weight:700;white-space:nowrap}
.blocco .giro:empty,.blocco .esito:empty{display:none}
.blocco .esito.no{background:rgba(255,255,255,.55)}
.blocco.buco{background:repeating-linear-gradient(135deg,var(--oro-chiaro) 0 .5rem,#FFE9A8 .5rem 1rem);color:var(--ambra-scuro);border:.14rem dashed var(--ambra);box-shadow:none;animation:pulsa 1.2s ease-in-out infinite;cursor:pointer;min-width:9rem;justify-content:center}
@keyframes pulsa{50%{box-shadow:0 0 0 .3rem rgba(224,169,27,.35)}}
.blocco.evidenzia > .testa-c,.blocco.evidenzia:not(.cont){outline:.22rem solid var(--oro);outline-offset:.1rem;filter:brightness(1.12)}
.blocco.errore > .testa-c,.blocco.errore:not(.cont){outline:.22rem solid var(--ambra);outline-offset:.1rem;animation:scossa .4s}
.blocco.aggancio{animation:aggancio .3s var(--molla)}
@keyframes aggancio{from{transform:scale(1.12)}}
@keyframes scossa{20%{transform:translateX(-.3rem)}40%{transform:translateX(.3rem)}60%{transform:translateX(-.2rem)}80%{transform:translateX(.2rem)}}
.segnaposto{align-self:stretch;padding:.3rem .6rem;border-radius:.6rem;border:.12rem dashed var(--carta-bordo);color:var(--inchiostro-soft);font-size:.88rem;cursor:pointer}
.segnaposto.attivo{border-color:var(--oro-scuro);background:rgba(224,169,27,.14);color:var(--inchiostro)}
.indicatore-drop{align-self:stretch;height:.35rem;border-radius:.2rem;background:var(--oro);flex:none}
.fantasma{position:fixed;z-index:var(--z-drag);pointer-events:none;transform:translate(-30%,-50%) rotate(-2deg);opacity:.92;filter:drop-shadow(0 .5rem .6rem rgba(0,0,0,.35))}
.sola-lettura .blocco{cursor:default}
.sola-lettura .x,.sola-lettura .segnaposto{display:none}
.cassetto .blocco.nuovo::after{content:"nuovo";position:absolute;top:-.55rem;right:-.3rem;padding:0 .4rem;border-radius:.6rem;background:var(--oro);color:#3A2A00;font-size:.7rem}
.aiuto-fantasma{opacity:.55;outline:.2rem dashed var(--oro);outline-offset:.15rem;pointer-events:none}
.aiuto-qui{box-shadow:0 0 0 .35rem rgba(224,169,27,.55) !important;animation:pulsa 1s ease-in-out infinite}

/* ---------- pelle tessere (percorsi 1-2) */
[data-disp="A"] #p-codice .dentro{flex-direction:column}
[data-disp="A"] .rotaia{display:none}
[data-disp="A"] .cassetto{order:3;width:auto;flex-direction:row;align-items:center;justify-content:center;gap:1rem;border-right:none;border-top:.12rem dashed var(--carta-bordo);padding:.7rem}
[data-disp="A"] .cassetto h4{display:none}
[data-disp="A"] #programma{flex-direction:row;flex-wrap:wrap;align-items:center;align-content:flex-start;gap:.5rem;padding:.8rem}
[data-disp="A"] .area-prog{flex-direction:row}
[data-disp="A"] .zaino{display:none}
.lato-via{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;padding:.6rem .9rem;border-left:.12rem dashed var(--carta-bordo)}
[data-pelle="tessere"] .blocco{flex-direction:column;justify-content:center;gap:.15rem;min-width:5.2rem;min-height:5.2rem;padding:.4rem .5rem .5rem;border-radius:1rem;font-size:1rem;text-align:center}
[data-pelle="tessere"] .blocco .ico{width:2.6rem;height:2.6rem}
[data-pelle="tessere"] .blocco .parola{display:none}
[data-pelle="tessere"] .blocco.cappello{min-width:4.4rem;border-radius:1rem}
[data-pelle="tessere"] .blocco.cont{flex-direction:row;align-items:stretch;min-width:0;min-height:5.6rem;border-radius:1rem;background:var(--c);padding:.3rem;gap:.3rem}
[data-pelle="tessere"] .testa-c{flex-direction:column;justify-content:center;border-radius:.8rem;box-shadow:none;padding:.2rem .4rem;min-width:4.4rem}
[data-pelle="tessere"] .piede-c,[data-pelle="tessere"] .mezzo-c{display:none}
[data-pelle="tessere"] .corpo{flex-direction:row;flex-wrap:wrap;align-items:center;gap:.4rem;border-left:none;background:rgba(255,255,255,.88);border-radius:.8rem;padding:.3rem .4rem;min-width:5.6rem;min-height:5rem}
[data-pelle="tessere"] .segnaposto{align-self:center;min-width:3.4rem;min-height:5rem;display:flex;align-items:center;justify-content:center;font-size:0;border-radius:1rem}
[data-pelle="tessere"] .segnaposto::after{content:"+";font:800 1.8rem var(--f-display);color:var(--carta-bordo)}
[data-pelle="tessere"] .segnaposto.attivo::after{color:var(--oro-scuro)}
[data-pelle="tessere"] .indicatore-drop{align-self:center;width:.4rem;height:4.4rem}
[data-pelle="tessere"] .blocco .x{position:absolute;top:-.4rem;right:-.4rem;margin:0;width:1.5rem;height:1.5rem}
[data-pelle="tessere"] .blocco.buco{min-width:5.2rem;font-size:2rem}
[data-pelle="tessere"] .contan button{width:1.9rem;height:2rem;font-size:1.3rem}
[data-pelle="tessere"] .contan .conto{font-size:1.3rem;min-width:1.7rem}
.pallini{display:inline-flex;gap:.18rem;align-items:center}
.pallini i{width:.62rem;height:.62rem;border-radius:50%;background:currentColor;opacity:.25}
.pallini i.si{opacity:1}
[data-pelle="tessere"] .pill{padding:.2rem .55rem}
[data-pelle="tessere"] .pill .pallini i{width:.75rem;height:.75rem}
[data-disp="A"] #b-esegui{width:6.6rem;height:6.6rem;border-radius:50%;font-size:1.6rem;padding:0;flex-direction:column;gap:0}
[data-disp="A"] #b-esegui .ico{width:2.2rem;height:2.2rem}
[data-disp="A"] .lato-via .btn.piccolo{padding:.5em .7em}

/* ---------- editor di testo e pannello del codice */
.ed-testo{flex:1;min-height:0;display:flex;flex-direction:column;background:#FFFDF6}
.ed-area{position:relative;flex:1;min-height:0;display:flex;overflow:auto;font:500 1.12rem/1.6 var(--f-mono)}
.ed-num{flex:none;padding:.6rem .5rem .6rem .7rem;text-align:right;color:#B4A27B;background:var(--carta-ombra);white-space:pre;min-height:100%;height:max-content}
.ed-num span{display:block}
.ed-num span.ora{background:var(--oro);color:#3A2A00;border-radius:.3rem;font-weight:700}
.ed-num span.guasta{background:var(--ambra);color:#fff;border-radius:.3rem;font-weight:700}
.ed-strati{position:relative;flex:1;min-width:0;min-height:100%;height:max-content}
.ed-colori,.ed-testo textarea{margin:0;padding:.6rem .8rem;font:inherit;white-space:pre;tab-size:4;border:none;outline:none}
.ed-colori{position:relative;pointer-events:none;color:var(--inchiostro);min-height:100%}
.ed-colori .riga{display:block;min-height:1.6em;border-radius:.3rem}
.ed-colori .riga.ora{background:rgba(224,169,27,.3)}
.ed-colori .riga.guasta{background:rgba(199,123,39,.22)}
.ed-testo textarea{position:absolute;inset:0;width:100%;height:100%;resize:none;overflow:hidden;background:transparent;color:transparent;caret-color:var(--inchiostro);-webkit-user-select:text;user-select:text}
.ed-testo textarea[readonly]{caret-color:transparent;cursor:default}
.k-chiave{color:#7A52C7;font-weight:700}.k-mov{color:#2F6FD0;font-weight:700}.k-salto{color:#C2600E;font-weight:700}.k-sens{color:#12808C;font-weight:700}
.k-cost{color:#1E6B38;font-weight:700}.k-num{color:#A8600A}.k-comm{color:#9A8C70;font-style:italic}.k-var{color:#158F9C}
.k-buco{background:var(--oro-chiaro);color:var(--ambra-scuro);border-radius:.3rem;box-shadow:0 0 0 .1rem var(--ambra);font-weight:700}
.ed-tessere{flex:none;display:flex;flex-wrap:wrap;gap:.35rem;padding:.5rem .6rem;border-top:.12rem solid var(--carta-bordo);background:var(--carta)}
.ed-tessere button{padding:.2rem .6rem;border-radius:.5rem;background:#fff;border:.12rem solid var(--carta-bordo);font:700 .95rem var(--f-mono);color:var(--inchiostro)}
.ed-tessere button:hover{border-color:var(--blu-medio);background:var(--blu-chiaro)}
.ed-errore{flex:none;padding:.45rem .8rem;background:var(--ambra-chiaro);color:#4A2B05;border-top:.16rem solid var(--ambra);font-size:1.02rem}
.ed-errore b{font-family:var(--f-display)}
.codice-fianco{flex:none;max-height:42%;display:flex;flex-direction:column;border-top:.16rem solid var(--carta-bordo);background:#FFFDF6}
.codice-fianco h4{flex:none;padding:.25rem .8rem;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--inchiostro-soft);background:var(--carta-ombra)}
.codice-fianco pre{flex:1;overflow:auto;margin:0;padding:.4rem .8rem;font:500 1.02rem/1.5 var(--f-mono);white-space:pre}
.codice-fianco pre div{border-radius:.3rem;padding:0 .3rem}
.codice-fianco pre div.ora{background:rgba(224,169,27,.38)}
.codice-fianco pre .vuoto{color:var(--inchiostro-soft);font-family:var(--f-body);font-style:italic}

/* ---------- campo di gara */
#p-campo .dentro{position:relative;background:#7DB6E8}
#campo{position:relative;flex:1;min-height:0;overflow:hidden}
.c-sfondo{position:absolute;inset:0;background-size:cover;background-position:center 62%}
.c-strato{position:absolute;inset:0}
.c-pista{position:absolute;border-radius:1.2rem;background:linear-gradient(#E3C38A,#C9A56A);box-shadow:inset 0 .25rem 0 rgba(255,255,255,.35),inset 0 -.3rem 0 rgba(90,55,22,.35),0 .4rem 1rem rgba(0,0,0,.28);border:.14rem solid rgba(90,55,22,.55)}
.c-cella{position:absolute;top:0;bottom:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:.15rem;border-left:.1rem dashed rgba(90,55,22,.4);font-family:var(--f-display);font-weight:800;color:rgba(74,45,15,.8);font-size:var(--num,1.2rem)}
.c-cella:first-child{border-left:none}
.c-cella.via{font-size:calc(var(--num,1.2rem)*.68);letter-spacing:.04em}
.c-cella.fine{background:repeating-conic-gradient(#2B2118 0 25%,#F7EED6 0 50%) 0 0/1.1rem 1.1rem;color:#fff;text-shadow:0 0 .2rem #000,0 0 .2rem #000;border-radius:0 1.1rem 1.1rem 0}
.c-cella.scelta{background:rgba(224,169,27,.55);box-shadow:inset 0 0 0 .2rem var(--oro-scuro)}
.c-pista.si-tocca .c-cella{cursor:pointer}
.c-pista.si-tocca .c-cella:hover{background:rgba(255,255,255,.4)}
.c-cella.qui{background:rgba(224,169,27,.5);animation:pulsa 1s ease-in-out infinite}
.c-ost{position:absolute;transform-origin:50% 100%;transition:transform .45s cubic-bezier(.5,0,.8,.4),filter .3s,opacity .3s;pointer-events:none}
.c-ost img{display:block;width:100%;height:auto}
.c-ost.abbattuto{transform:rotate(72deg) translateY(8%);filter:saturate(.5) brightness(.9);opacity:.8}
.c-ost .segno{position:absolute;left:50%;top:-1.5rem;transform:translateX(-50%);padding:.12rem .4rem;border-radius:1rem;background:rgba(255,255,255,.94);color:var(--c-salti);box-shadow:0 .1rem .3rem rgba(0,0,0,.35)}
.c-ost.netto .segno{background:var(--verde);color:#fff}
.c-ost.abbattuto .segno{background:var(--ambra);color:#fff}
.c-bandiera{position:absolute;pointer-events:none}
.c-cav{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
.c-cav .salto,.c-cav .corpo-c{position:relative;transform-origin:50% 85%}
.c-cav img{display:block;width:100%;height:auto;filter:drop-shadow(0 .35rem .3rem rgba(0,0,0,.3))}
.c-cav.galoppa .corpo-c{animation:galoppo .32s ease-in-out infinite}
@keyframes galoppo{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-7%) rotate(2deg)}}
.c-cav.impunta .corpo-c{animation:impunta .6s ease-out}
@keyframes impunta{0%{transform:rotate(0)}30%{transform:rotate(-13deg) translateY(-6%)}55%{transform:rotate(4deg)}75%{transform:rotate(-5deg)}100%{transform:rotate(0)}}
.c-cav.stanco .corpo-c{transform:rotate(5deg) translateY(4%);filter:saturate(.7);transition:transform .5s,filter .5s}
.c-cav.fuori{opacity:0;transition:opacity .6s .2s}
.c-ombra{position:absolute;left:12%;right:12%;bottom:-2%;height:9%;border-radius:50%;background:rgba(0,0,0,.28);filter:blur(.2rem)}
.c-polvere{position:absolute;width:1rem;height:1rem;border-radius:50%;background:rgba(214,186,140,.85);pointer-events:none;animation:polvere .6s ease-out forwards}
@keyframes polvere{to{transform:translate(-1.6rem,-.9rem) scale(2.4);opacity:0}}
.c-bolla{position:absolute;z-index:6;transform:translate(-50%,-100%);padding:.3rem .8rem;border-radius:1rem;background:#fff;border:.18rem solid var(--ambra);color:#4A2B05;font-family:var(--f-display);font-weight:800;font-size:1.15rem;white-space:nowrap;box-shadow:var(--ombra-1);display:flex;align-items:center;gap:.4rem;animation:sale .3s var(--molla) both}

<script>
/*CORE-START*/
// Motore puro di Ippo Coding: nessun accesso al DOM. Lo verifica in Node _lavoro/test_core.mjs.
const IPPO = (() => {
  'use strict';
  let ultimoId = 0;
  const nuovoId = () => ++ultimoId;

  // ============================================================ LINGUAGGIO
  // Sottoinsieme di Python con funzioni in italiano. Il testo diventa un albero di nodi:
  //   {id,t:'avanza',n} {t:'salta',p} {t:'riposa'} {t:'annuncia',v} {t:'ripeti',n,body} {t:'finche',c,body}
  //   {t:'se',c,body,alt} {t:'assegna',nome,v,piu?} {t:'def',nome,body} {t:'chiama',nome} {t:'buco'}
  // Espressioni: {k:'num',v,sim?} {k:'var',nome} {k:'sens',nome} {k:'op',op,a,b} {k:'not',a} {k:'buco'}
  // Gli editor a tessere e a mattoncini costruiscono lo stesso albero senza passare dal testo.
  const AZIONI = { avanza: 1, salta: 1, riposa: 0, annuncia: 1 };
  const SENSORI = ['ostacolo_davanti', 'altezza', 'traguardo', 'energia'];
  const COSTANTI = { BASSA: 1, MEDIA: 2, ALTA: 3 };
  const CHIAVI = ['for', 'in', 'range', 'while', 'if', 'elif', 'else', 'def', 'not', 'and', 'or', 'pass'];
  const ITALIANO = { se: 'if', altrimenti: 'else', ripeti: 'for', finche: 'while', 'finché': 'while', mentre: 'while', non: 'not', e: 'and', o: 'or', oppure: 'or', definisci: 'def', funzione: 'def' };
  const ESEMPIO = { avanza: 'avanza(2)', salta: 'salta(MEDIA)', riposa: 'riposa()', annuncia: 'annuncia(conta)' };

  function Err(riga, msg) { this.riga = riga; this.msg = msg; }

  function distanza(a, b) {   // Levenshtein, per suggerire la parola giusta
    const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[a.length][b.length];
  }
  function sconosciuta(w) {
    const basso = w.toLowerCase();
    if (ITALIANO[basso]) return `in Python «${w}» si scrive «${ITALIANO[basso]}».`;
    const noti = Object.keys(AZIONI).concat(SENSORI, CHIAVI);
    if (noti.includes(basso)) return `«${w}» si scrive tutto minuscolo: «${basso}».`;
    if (w.toUpperCase() in COSTANTI) return `«${w}» si scrive tutto maiuscolo: «${w.toUpperCase()}».`;
    let migliore = null, d = 3;
    noti.concat(Object.keys(COSTANTI)).forEach(n => { const x = distanza(basso, n.toLowerCase()); if (x < d) { d = x; migliore = n; } });
    return migliore ? `non conosco «${w}». Volevi scrivere «${migliore}»?` : `non conosco «${w}».`;
  }

  function lessico(s, riga) {
    const out = []; let i = 0;
    while (i < s.length) {
      const c = s[i];
      if (c === ' ' || c === '\t') { i++; continue; }
      if (s.startsWith('___', i)) { while (s[i] === '_') i++; out.push({ k: 'buco' }); continue; }
      if (/[A-Za-zÀ-ÿ_]/.test(c)) { let j = i; while (j < s.length && /[A-Za-zÀ-ÿ_0-9]/.test(s[j])) j++; out.push({ k: 'nome', v: s.slice(i, j) }); i = j; continue; }
      if (/[0-9]/.test(c)) { let j = i; while (j < s.length && /[0-9]/.test(s[j])) j++; out.push({ k: 'num', v: +s.slice(i, j) }); i = j; continue; }
      const due = s.slice(i, i + 2);
      if (['==', '!=', '<=', '>=', '+='].includes(due)) { out.push({ k: 'op', v: due }); i += 2; continue; }
      if ('()<>=+-:,'.includes(c)) { out.push({ k: 'op', v: c }); i++; continue; }
      throw new Err(riga, `non capisco il simbolo «${c}».`);
    }
    return out;
  }

  function parse(src) {
    try {
      const righe = [];
      String(src == null ? '' : src).replace(/\r/g, '').split('\n').forEach((grezza, k) => {
        const senza = grezza.replace(/#.*$/, '').replace(/\s+$/, '');
        if (!senza.trim()) return;
        const sp = senza.match(/^[ \t]*/)[0];
        righe.push({ n: k + 1, rientro: sp.replace(/\t/g, '    ').length, tok: lessico(senza.slice(sp.length), k + 1) });
      });
      const definite = new Set(), chiamate = [];
      let pos = 0;
      const base = righe.length ? righe[0].rientro : 0;

      function blocco(ind, aperti) {
        const nodi = [];
        while (pos < righe.length) {
          const r = righe[pos];
          if (r.rientro > ind) throw new Err(r.n, 'questa riga è rientrata, ma la riga sopra non apre un blocco con i due punti. Togli il rientro.');
          if (r.rientro < ind) {
            if (!aperti.includes(r.rientro)) throw new Err(r.n, 'il rientro di questa riga non corrisponde a nessun blocco aperto. Allineala alle righe sopra.');
            break;
          }
          const n = istruzione(r, ind, aperti);
          if (n) nodi.push(n);
        }
        return nodi;
      }
      function corpo(r, ind, aperti) {
        const prox = righe[pos];
        if (!prox || prox.rientro <= ind) throw new Err(prox ? prox.n : r.n, 'dopo i due punti le istruzioni del blocco vanno rientrate di 4 spazi.');
        return blocco(prox.rientro, aperti.concat(ind));
      }
      function istruzione(r, ind, aperti, modo) {
        pos++;
        const T = r.tok; let i = 0;
        const eOp = v => !!T[i] && T[i].k === 'op' && T[i].v === v;
        const eNome = v => !!T[i] && T[i].k === 'nome' && (v === undefined || T[i].v === v);
        const vuole = (v, msg) => { if (!eOp(v)) throw new Err(r.n, msg); i++; };
        const fine = () => { if (i < T.length) throw new Err(r.n, `in fondo alla riga c'è qualcosa di troppo: «${T[i].v === undefined ? '___' : T[i].v}».`); };
        const duePunti = che => { if (!eOp(':')) throw new Err(r.n, `dopo «${che}» servono i due punti «:» alla fine della riga.`); i++; fine(); };
        const nodo = (t, extra) => Object.assign({ id: nuovoId(), t, riga: r.n }, extra);

        function atomo() {
          const x = T[i++];
          if (!x) throw new Err(r.n, 'la riga finisce troppo presto: manca un valore.');
          if (x.k === 'buco') return { k: 'buco' };
          if (x.k === 'num') return { k: 'num', v: x.v };
          if (x.k === 'op' && x.v === '(') { const e = espr(); vuole(')', 'manca una parentesi chiusa «)».'); return e; }
          if (x.k === 'nome') {
            if (x.v in COSTANTI) return { k: 'num', v: COSTANTI[x.v], sim: x.v };
            if (x.v === 'True' || x.v === 'False') return { k: 'num', v: x.v === 'True' ? 1 : 0, sim: x.v };
            if (eOp('(')) {
              i++; vuole(')', `«${x.v}()» si scrive con le parentesi vuote.`);
              if (SENSORI.includes(x.v)) return { k: 'sens', nome: x.v };
              throw new Err(r.n, x.v in AZIONI ? `«${x.v}» è un comando: va da solo su una riga, non dentro un confronto.` : sconosciuta(x.v));
            }
            if (SENSORI.includes(x.v)) throw new Err(r.n, `«${x.v}» è un sensore e vuole le parentesi: ${x.v}().`);
            if (CHIAVI.includes(x.v) || x.v in AZIONI) throw new Err(r.n, `qui serve un valore, non «${x.v}».`);
            if (ITALIANO[x.v.toLowerCase()] || (x.v.toUpperCase() in COSTANTI) || SENSORI.includes(x.v.toLowerCase())) throw new Err(r.n, sconosciuta(x.v));
            return { k: 'var', nome: x.v };
          }
          throw new Err(r.n, `qui serve un valore, non «${x.v}».`);
        }
        function eSomma() { let a = atomo(); while (eOp('+') || eOp('-')) { const op = T[i++].v; a = { k: 'op', op, a, b: atomo() }; } return a; }

          if (eOp(':')) throw new Err(r.n, `dopo «${w}(…)» non vanno i due punti: è un comando, non l'inizio di un blocco.`);
          fine();
          if (w in AZIONI) {
            if (args.length !== AZIONI[w]) throw new Err(r.n, AZIONI[w] ? `«${w}» vuole un valore fra parentesi, per esempio ${ESEMPIO[w]}.` : `«${w}()» si scrive con le parentesi vuote.`);
            if (w === 'avanza') return nodo('avanza', { n: args[0] });
            if (w === 'salta') return nodo('salta', { p: args[0] });
            if (w === 'riposa') return nodo('riposa');
            return nodo('annuncia', { v: args[0] });
          }
          if (SENSORI.includes(w)) throw new Err(r.n, `«${w}()» è un sensore: dà un valore, da solo su una riga non fa niente. Usalo dentro un «if» o un «while».`);
          if (args.length) throw new Err(r.n, sconosciuta(w));
          chiamate.push({ nome: w, riga: r.n });
          return nodo('chiama', { nome: w });
        }
        if (w in AZIONI) throw new Err(r.n, `i comandi vogliono le parentesi: ${ESEMPIO[w]}.`);
        throw new Err(r.n, sconosciuta(w));
      }

      const ast = blocco(base, []);
      if (pos < righe.length) throw new Err(righe[pos].n, 'il rientro di questa riga non corrisponde a nessun blocco aperto. Allineala alle righe sopra.');
      chiamate.forEach(c => {
        if (definite.has(c.nome)) return;
        const s = sconosciuta(c.nome);
        throw new Err(c.riga, /Volevi|si scrive/.test(s) ? s : `la funzione «${c.nome}» non è definita. Si definisce con «def ${c.nome}():».`);
      });
      return { ok: true, ast };
    } catch (e) {
      if (e instanceof Err) return { ok: false, errore: { riga: e.riga, msg: e.msg } };
      throw e;
    }
  }

  // dall'albero al testo
  const PREC = { or: 1, and: 2, '==': 4, '!=': 4, '<': 4, '>': 4, '<=': 4, '>=': 4, '+': 5, '-': 5 };
  function eTesto(e, sopra) {
    sopra = sopra || 0;
    if (!e || e.k === 'buco') return '___';
    if (e.k === 'num') return e.sim || String(e.v);
    if (e.k === 'var') return e.nome;
    if (e.k === 'sens') return e.nome + '()';
    if (e.k === 'not') { const s = 'not ' + eTesto(e.a, 3); return sopra > 3 ? '(' + s + ')' : s; }
    const p = PREC[e.op], s = eTesto(e.a, p) + ' ' + e.op + ' ' + eTesto(e.b, p + 1);
    return sopra > p ? '(' + s + ')' : s;

  function toLines(ast) {
    const out = [];
    const corpo = (lista, d, cicli) => { if (!lista.length) out.push({ id: null, depth: d, text: 'pass' }); else giro(lista, d, cicli); };
    function giro(lista, d, cicli) {
      lista.forEach(n => {
        const r = text => out.push({ id: n.id, depth: d, text });
        if (n.t === 'buco') r('___');
        else if (n.t === 'avanza') r(`avanza(${eTesto(n.n)})`);
        else if (n.t === 'salta') r(`salta(${eTesto(n.p)})`);
        else if (n.t === 'riposa') r('riposa()');
        else if (n.t === 'annuncia') r(`annuncia(${eTesto(n.v)})`);
        else if (n.t === 'assegna') r(`${n.nome} ${n.piu ? '+=' : '='} ${eTesto(n.v)}`);
        else if (n.t === 'chiama') r(n.nome + '()');
        else if (n.t === 'def') { r(`def ${n.nome}():`); corpo(n.body, d + 1, cicli); }
        else if (n.t === 'ripeti') { r(`for ${n.v || 'ijklmn'[cicli] || 'i'} in range(${eTesto(n.n)}):`); corpo(n.body, d + 1, cicli + 1); }
        else if (n.t === 'finche') { r(`while ${eTesto(n.c)}:`); corpo(n.body, d + 1, cicli); }
        else if (n.t === 'se') {
          let cur = n, parola = 'if';
          for (;;) {
            out.push({ id: cur.id, depth: d, text: `${parola} ${eTesto(cur.c)}:` });
            corpo(cur.body, d + 1, cicli);
            if (cur.alt && cur.alt.length === 1 && cur.alt[0].t === 'se' && cur.alt[0].elif) { cur = cur.alt[0]; parola = 'elif'; continue; }
            if (cur.alt) { out.push({ id: null, di: cur.id, depth: d, text: 'else:' }); corpo(cur.alt, d + 1, cicli); }

  // quanto è lungo un programma: ogni istruzione vale 1 (contenitori compresi), i buchi no
  function conta(ast) { let n = 0; (ast || []).forEach(x => { if (x.t !== 'buco') n++; if (x.body) n += conta(x.body); if (x.alt) n += conta(x.alt); }); return n; }

  // ============================================================ PISTE
  // Una pista è una stringa: un carattere per casella da 1 a N. «.» libera, «b» «m» «a» ostacolo basso, medio, alto.
  // La casella 0 è la partenza, la N il traguardo. Mai due ostacoli vicini; l'ultimo al più in N-2 (si atterra a +2).
  const ALTEZZE = { b: 1, m: 2, a: 3 };
  function pista(str, opz) {
    opz = opz || {};
    const ost = {}; let somma = 0, n = 0, alti = 0, prima = -9;
    for (let k = 1; k <= str.length; k++) {
      const c = str[k - 1];
      if (c === '.') continue;
      if (!(c in ALTEZZE)) throw new Error(`pista «${str}»: carattere non valido «${c}»`);
      if (k - prima < 2) throw new Error(`pista «${str}»: due ostacoli vicini alle caselle ${prima} e ${k}`);
      if (k > str.length - 2) throw new Error(`pista «${str}»: ostacolo troppo in fondo alla casella ${k} (al massimo in N-2)`);
      ost[k] = ALTEZZE[c]; somma += ALTEZZE[c]; n++; if (ALTEZZE[c] === 3) alti++; prima = k;
    }
    let e0 = null, emax = null, tmax = null;
    if (opz.e0 != null) { e0 = opz.e0; emax = opz.emax != null ? opz.emax : opz.e0; }
    else if (opz.e != null) { e0 = somma + opz.e; emax = e0; }      // energia = somma delle altezze + margine
    // tempo minimo = passi + salti + riposi indispensabili; il margine t si aggiunge
    if (opz.t != null) tmax = str.length - n + (e0 == null ? 0 : Math.max(0, somma - e0)) + opz.t;
    return { str, len: str.length, ost, e0, emax, tmax, somma, n, alti };
  }

  // ============================================================ ESECUZIONE
  // esegui() non anima nulla: restituisce i fotogrammi. Ogni fotogramma porta il mattoncino (bid) e la riga
  // che lo hanno prodotto e lo stato dopo l'azione: da lì nascono animazione, evidenziazione e passo-passo.
  const NOME_OST = { 1: 'un tronco (ostacolo basso)', 2: 'una barriera (ostacolo medio)', 3: 'un muro (ostacolo alto)' };
  const NOME_POT = { 1: 'a potenza bassa', 2: 'a potenza media', 3: 'a potenza alta' };
  const LIMITE_PASSI = 600;
  function esegui(ast, p, opz) {
    opz = opz || {};
    const S = { pos: 0, energia: p.e0, pen: 0, tempo: 0, detto: null, arrivato: false };
    const frames = [], vars = Object.create(null), defs = Object.create(null);
    let ops = 0;
    function Stop(fine) { this.fine = fine; }
    const dove = n => ({ bid: n.id, riga: n.riga == null ? null : n.riga });
    const foto = (n, tipo, extra) => { const f = Object.assign({ tipo }, dove(n), { pos: S.pos, energia: S.energia, pen: S.pen, tempo: S.tempo }, extra); frames.push(f); return f; };
    const ferma = (n, tipo, breve, msg, extra) => { throw new Stop(Object.assign({ tipo, breve, msg, cella: S.pos }, dove(n), extra)); };
    const conto = n => { if (++ops > LIMITE_PASSI) ferma(n, 'stallo', 'CAVALLO FERMO', 'Il programma continua a ripetere senza portare il cavallo al traguardo. Quale istruzione dentro il ciclo lo fa avanzare?'); };
    const vuota = (n, nome) => ferma(n, 'errore', 'VARIABILE VUOTA', `La variabile «${nome}» non ha ancora un valore. Dagliene uno prima di usarla, per esempio ${nome} = 0.`);

    function valore(e, n) {
      if (!e || e.k === 'buco') ferma(n, 'errore', 'MANCA UN PEZZO', 'In questa istruzione manca un pezzo: completala prima di partire.');
      if (e.k === 'num') return e.v;
      if (e.k === 'var') { if (!(e.nome in vars)) vuota(n, e.nome); return vars[e.nome]; }
      if (e.k === 'sens') {
        if (e.nome === 'ostacolo_davanti') return !!p.ost[S.pos + 1];
        if (e.nome === 'altezza') return p.ost[S.pos + 1] || 0;
        if (e.nome === 'traguardo') return S.pos === p.len;
        return S.energia == null ? 99 : S.energia;
      }
      if (e.k === 'not') return !valore(e.a, n);
      if (e.op === 'and') return !!(valore(e.a, n) && valore(e.b, n));
      if (e.op === 'or') return !!(valore(e.a, n) || valore(e.b, n));
      const a = +valore(e.a, n), b = +valore(e.b, n);
      switch (e.op) {
        case '+': return a + b; case '-': return a - b;
        case '==': return a === b; case '!=': return a !== b;

    function uno(n, prof) {
      conto(n);
      switch (n.t) {
        case 'def': break;
        case 'buco': ferma(n, 'errore', 'MANCA UN PEZZO', 'Qui manca un pezzo del programma: completalo prima di partire.'); break;
        case 'avanza': {
          const k = +valore(n.n, n);
          if (!Number.isInteger(k) || k < 1) ferma(n, 'errore', 'PASSI SBAGLIATI', `«avanza» vuole un numero di passi da 1 in su: qui vale ${k}.`);
          for (let i = 0; i < k; i++) {
            if (S.arrivato) ferma(n, 'fuori', 'TROPPI PASSI', `Il cavallo era già al traguardo (casella ${p.len}) e ha proseguito: fuori pista. Quanti passi servivano davvero?`);
            const h = p.ost[S.pos + 1];
            if (h) ferma(n, 'rifiuto', 'QUI SI SALTA', `Alla casella ${S.pos + 1} c'è ${NOME_OST[h]}: il cavallo non può attraversarlo e si è fermato. Che cosa deve fare, arrivato alla casella ${S.pos}?`, { cella: S.pos + 1, h });
            const da = S.pos; S.pos++; S.tempo++;
            if (S.pos === p.len) S.arrivato = true;
            foto(n, 'passo', { da, a: S.pos, arrivo: S.arrivato });
          }
          break;
        }
        case 'salta': {
          if (S.arrivato) ferma(n, 'fuori', 'TROPPI SALTI', `Il cavallo era già al traguardo (casella ${p.len}) e ha provato a saltare ancora: fuori pista. Quale istruzione è di troppo?`);
          const pot = +valore(n.p, n), h = p.ost[S.pos + 1] || 0;
          if (!h) ferma(n, 'vuoto', 'NIENTE DA SALTARE', `Alla casella ${S.pos + 1} non c'è nessun ostacolo: il cavallo ha saltato a vuoto e si è impuntato. Dove serviva davvero il salto?`, { cella: S.pos + 1 });
          if (![1, 2, 3].includes(pot)) ferma(n, 'errore', 'POTENZA SBAGLIATA', `La potenza del salto può essere BASSA, MEDIA o ALTA (1, 2 o 3): qui vale ${pot}.`);
          if (S.energia != null && S.energia < pot) ferma(n, 'stanco', 'CAVALLO STANCO', `Per questo salto ${NOME_POT[pot]} servono ${pot} di energia, ma ne restano ${S.energia}. Dove ne hai spesa più del necessario?`, { cella: S.pos + 1, h });
          if (S.energia != null) S.energia -= pot;
          const da = S.pos, netto = pot >= h;
          if (!netto) S.pen += 4;
          S.pos += 2; S.tempo++;
          if (S.pos === p.len) S.arrivato = true;
          const f = foto(n, 'salto', { da, a: S.pos, cella: da + 1, p: pot, h, esito: netto ? 'netto' : 'abbattuto', arrivo: S.arrivato });
          if (!netto) { f.breve = 'SALTO TROPPO BASSO'; f.msg = `Alla casella ${da + 1} c'era ${NOME_OST[h]}: il salto ${NOME_POT[pot]} l'ha abbattuto (4 penalità). Che potenza serve per superarlo?`; }
          else if (pot > h) f.spreco = pot - h;
          break;
        }
        case 'riposa': if (S.energia != null) S.energia = Math.min(p.emax, S.energia + 1); S.tempo++; foto(n, 'riposa'); break;
        case 'annuncia': S.detto = +valore(n.v, n); foto(n, 'annuncia', { v: S.detto }); break;
        case 'assegna': {
          const v = valore(n.v, n);
          if (n.piu) { if (!(n.nome in vars)) vuota(n, n.nome); vars[n.nome] = +vars[n.nome] + +v; }

        }
        case 'chiama': {
          const d = defs[n.nome];
          if (!d) ferma(n, 'errore', 'FUNZIONE MANCANTE', `La funzione «${n.nome}» non è definita: si definisce con «def ${n.nome}():».`);

          lista(d.body, prof + 1);
          break;
        }
        case 'ripeti': {
          const k = +valore(n.n, n);
          if (!Number.isInteger(k) || k < 0) ferma(n, 'errore', 'GIRI SBAGLIATI', `Il numero di giri deve essere un numero intero: qui vale ${k}.`);
          for (let i = 0; i < k; i++) { conto(n); if (n.v) vars[n.v] = i; foto(n, 'giro', { i: i + 1, n: k }); lista(n.body, prof); }
          break;
        }
        case 'finche': { let i = 0; while (valore(n.c, n)) { conto(n); foto(n, 'giro', { i: ++i, n: null }); lista(n.body, prof); } break; }
        case 'se': { const v = !!valore(n.c, n); foto(n, 'cond', { vero: v }); if (v) lista(n.body, prof); else if (n.alt) lista(n.alt, prof); break; }
      }
    }

    let fine;
    try {
      ast.forEach(n => { if (n.t === 'def') defs[n.nome] = n; });
      lista(ast, 0);
      fine = S.arrivato ? { tipo: 'traguardo', cella: p.len }
        : { tipo: 'corto', breve: 'MANCANO PASSI', cella: S.pos, msg: `Il programma è finito con il cavallo alla casella ${S.pos}, ma il traguardo è alla ${p.len}. Che cosa manca?` };
    } catch (e) { if (!(e instanceof Stop)) throw e; fine = e.fine; }
    if (fine.tipo === 'stallo' && frames.length > 30) frames.length = 30;      // non si anima un ciclo infinito
    if (fine.tipo === 'traguardo') {
      if (opz.annuncio) {
        const atteso = opz.annuncio === 'alti' ? p.alti : p.n, giusto = S.detto === atteso;
        if (!giusto) S.pen += 4;
        fine.annuncio = { detto: S.detto, atteso, giusto };
      }
      if (p.tmax != null && S.tempo > p.tmax) { fine.ritardo = S.tempo - p.tmax; S.pen += fine.ritardo; }
    }
    frames.push({ tipo: 'fine', fine, pos: S.pos, energia: S.energia, pen: S.pen, tempo: S.tempo });
    return { frames, fine, pos: S.pos, pen: S.pen, energia: S.energia, tempo: S.tempo, detto: S.detto, concluso: fine.tipo === 'traguardo' };
  }

  // ============================================================ SEED E GENERAZIONE

  function cyrb53(str, seed) {

  }
  // Una famiglia di piste: {len:[a,b], ost:[a,b], alt:'bma', gap, da, e | e0+emax, t}.
  // gap = distanza minima fra ostacoli (predefinita 2), da = prima casella che può avere un ostacolo (predefinita 2).
  function genera(fam, rng) {
    const fra = (a, b) => a + Math.floor(rng() * (b - a + 1));
    const len = fra(fam.len[0], fam.len[1]), gap = fam.gap || 2, da = fam.da || 2;
    const posti = len - 2 - da + 1;                                  // caselle da..len-2
    let k = fra(fam.ost[0], fam.ost[1]);
    while (k > 0 && posti - (k - 1) * (gap - 1) < k) k--;            // se non ci stanno, meno ostacoli
    // k posizioni con distanza minima: si scelgono k numeri distinti in uno spazio compresso, poi si allargano
    const liberi = posti - (k - 1) * (gap - 1), pool = Array.from({ length: liberi }, (_, i) => i);
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }

// Effetti sintetizzati con Web Audio (nessun file); musiche mp3 CC0 in audio/, una per ambiente.
const Suoni = (() => {
  let ctx = null, bus = null, accesi = PAR.get('suoni') !== '0';
  function ac() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); bus = ctx.createDynamicsCompressor(); bus.connect(ctx.destination); } catch (e) { return null; } }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tono(f, dur, o) {
    if (!accesi) return; const c = ac(); if (!c) return; o = o || {};
    const t = c.currentTime + (o.tra || 0), osc = c.createOscillator(), g = c.createGain();
    osc.type = o.tipo || 'sine'; osc.frequency.setValueAtTime(f, t);
    if (o.a) osc.frequency.exponentialRampToValueAtTime(o.a, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.vol || 0.18, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  }

    const t = c.currentTime + (o.tra || 0), n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = buf; f.type = o.filtro || 'bandpass'; f.frequency.value = o.f || 900; f.Q.value = o.q || 1.2; g.gain.value = o.vol || 0.25;
    s.connect(f); f.connect(g); g.connect(bus); s.start(t);
  }
  return {
    get accesi() { return accesi; }, cambia() { accesi = !accesi; if (accesi) this.click(); return accesi; }, sveglia: ac,
    click() { tono(660, 0.06, { tipo: 'triangle', vol: 0.1 }); },
    pop() { tono(420, 0.09, { tipo: 'triangle', a: 760, vol: 0.14 }); },

    atterra() { rumore(0.12, { f: 260, q: 1.5, vol: 0.55 }); },

    traguardo() { [523, 659, 784, 1047].forEach((f, i) => tono(f, 0.28, { tipo: 'triangle', vol: 0.15, tra: i * 0.11 })); tono(1047, 0.5, { tipo: 'sine', vol: 0.1, tra: 0.44 }); },

const Musica = (() => {
  const TRACCE = { castello: ['audio/castello.mp3'], stalla: ['audio/stalla.mp3'], campo: ['audio/campo1.mp3', 'audio/campo2.mp3'] }, VOLUME = 0.22;
  let accesa = PAR.get('musica') !== '0', ambiente = null, brano = null, giro = 0, sbloccata = false, salita = null;
  function sfuma(a, a_vol, poi) {
    const da = a.volume, t0 = performance.now();
    (function passo() { const k = Math.min(1, (performance.now() - t0) / 700); a.volume = da + (a_vol - da) * k; if (k < 1) requestAnimationFrame(passo); else if (poi) poi(); })();
  }
  function parti() {
    if (!accesa || !sbloccata || !ambiente) return;
    const lista = TRACCE[ambiente], src = lista[giro % lista.length];
    if (brano && brano.dataset.src === src && !brano.paused) return;
    ferma();
    const a = new Audio(src); a.dataset.src = src; a.volume = 0; a.loop = lista.length === 1;
    a.addEventListener('ended', () => { if (brano === a) { giro++; brano = null; parti(); } });
    a.play().then(() => sfuma(a, VOLUME)).catch(() => {});
    brano = a;
  }
  function ferma() { const a = brano; brano = null; if (a) sfuma(a, 0, () => a.pause()); }
  return {
    get accesa() { return accesa; },
    cambia() { accesa = !accesa; if (accesa) parti(); else ferma(); return accesa; },
    sblocca() { if (sbloccata) return; sbloccata = true; parti(); },          // i browser fanno partire l'audio solo dopo un gesto
    ambiente(a) { if (a === ambiente) return; ambiente = a; if (!a) ferma(); else parti(); },
    fanfara() { if (!Suoni.accesi) return; clearTimeout(salita); if (brano) brano.volume = 0.05; const f = new Audio('audio/vittoria.mp3'); f.volume = 0.5; f.play().catch(() => {}); salita = setTimeout(() => { if (brano) sfuma(brano, VOLUME); }, 7000); }
  };
})();

// ============================================================ REGISTRO: progressi per classe e Mac
/* Stesso impianto di CyberStudent (13/11/2026). Lo studente tocca la classe e il Mac che usa; i traguardi stanno in un
   foglio Google della scuola (_lavoro/apps-script/ippo.gs). Si salvano solo classe, Mac e traguardi: mai un nome.
   Chi torna allo stesso Mac ritrova le sue stelle; chi lo cambia usa il codice gara. Se la rete non risponde si gioca lo stesso. */
const REGISTRO_URL = 'https://script.google.com/macros/s/AKfycbxGgW4_XSZxsNv8MVrLSFKIjZt0Tgx_4OuIN1YBBeX7jF7DjyboyIVHLGqYvm4Wuzrp/exec';   // indirizzo /exec dell'app web di Apps Script. Vuoto: niente foglio, restano sessionStorage e codici gara
const Registro = {
  url: PAR.get('registro') === '0' ? '' : REGISTRO_URL, stato: '',
  attivo() { return !!this.url; },
  chiama(par) {                                     // JSONP: un file solo non può leggere altrimenti da un altro dominio
    return new Promise((ok, ko) => {
      const cb = 'ippo_' + Date.now().toString(36) + Math.floor(Math.random() * 1e4), s = document.createElement('script');
      const fine = () => { clearTimeout(t); delete window[cb]; s.remove(); };
      const t = setTimeout(() => { fine(); ko(new Error('tempo')); }, 12000);
      window[cb] = d => { fine(); ok(d); };
      s.onerror = () => { fine(); ko(new Error('rete')); };
      s.src = this.url + '?' + new URLSearchParams(Object.assign({}, par, { cb }));
      document.head.appendChild(s);
    });
  },
  async tenta(par) {                                // in aula rispondono tutti insieme: un secondo tentativo basta
    for (let i = 0; ; i++) {
      try { const d = await this.chiama(par); if (d.ok || d.errore !== 'occupato' || i) return d; } catch (e) { if (i) throw e; }
      await attendi(1500);
    }
  },
  unisci(p) { if (!Array.isArray(p)) return; for (let i = 1; i <= 8; i++) STATO.stelle[i] = (STATO.stelle[i] | (p[i - 1] >>> 0)) >>> 0; },
  async leggi() {
    if (!this.attivo() || !STATO.chi) return (this.stato = '');
    try { const d = await this.tenta({ a: 'l', classe: STATO.chi.classe, mac: STATO.chi.mac }); if (d.ok) { this.unisci(d.p); this.stato = 'ok'; } else this.stato = 'errore'; }
    catch (e) { this.stato = 'rete'; }
    ricorda(); return this.stato;
  },
  async salva() {                                   // si manda sempre tutto: se un salvataggio non arriva, lo recupera il successivo
    ricorda();
    if (!this.attivo() || !STATO.chi) return;
    const io = STATO.chi, par = { a: 's', classe: io.classe, mac: io.mac };
    for (let i = 1; i <= 8; i++) par['p' + i] = STATO.stelle[i];
    try { const d = await this.tenta(par); if (STATO.chi !== io) return; if (d.ok) { this.unisci(d.p); this.stato = 'ok'; } else this.stato = 'errore'; }
    catch (e) { if (STATO.chi === io) this.stato = 'rete'; }
  },
  frase() { return !this.attivo() || !STATO.chi ? '' : this.stato === 'rete' ? 'La rete non risponde: salvo appena torna.' : this.stato === 'errore' ? 'Il foglio della scuola non salva: segnati il codice gara.' : 'Salvato per questo Mac.'; }

  if (!STATO.viste['apre' + p]) { STATO.viste['apre' + p] = 1; ricorda(); scena({ img: 'stalla', titolo: `${P.grado}: ${P.titolo}`, testo: STORIA[p].apre }); }
}

// ============================================================ CAMPO DI GARA
// Disegna pista, ostacoli e cavaliere con elementi DOM e riproduce i fotogrammi del motore.
// Il cavaliere è un'immagine fissa (scontornata dai PNG di Andrea): lo muovono trasformazioni e Web Animations.
const Campo = (() => {
  const OST = { 1: { img: 'ost-tronco', rapp: 300 / 285, alt: 0.34, nome: 'tronco' }, 2: { img: 'ost-barriera', rapp: 290 / 300, alt: 0.50, nome: 'barriera' }, 3: { img: 'ost-muro', rapp: 201 / 300, alt: 0.60, nome: 'muro' } };
  const RAPP_CAV = { aquila: 640 / 545, tasso: 640 / 488, cero: 640 / 519, quercia: 640 / 540 };
  const DURATE = { passo: 380, salto: 760, riposa: 520, annuncia: 1000, giro: 150, cond: 170, assegna: 150, chiama: 150 };
  let radice, sfondo, piano, cart, hud, pista = null, opz = {}, geo = null, cav = null, pos = 0, vivo = 0, attese = [];
  const rem = () => parseFloat(getComputedStyle(document.documentElement).fontSize);

  function monta(elemento) {
    radice = elemento; radice.innerHTML = '';
    sfondo = el('div', 'c-sfondo'); piano = el('div', 'c-strato'); cart = el('div', 'cartiglio'); hud = el('div', 'hud');
    hud.innerHTML = '<div class="manche" id="hud-manche"></div><span class="spazio"></span><div class="misura" id="hud-tempo" hidden></div><div class="misura" id="hud-pen" hidden></div><div class="misura" id="hud-energia" hidden></div>';
    radice.append(sfondo, piano, cart, hud);
    new ResizeObserver(() => { if (pista) disegna(); }).observe(radice);
  }
  // la geometria dipende solo dalle misure del riquadro e dalla lunghezza della pista
  function misura() {
    const W = radice.clientWidth, H = radice.clientHeight, r = rem(), n = pista.len + 1;
    // a sinistra della casella VIA resta lo spazio per il corpo del cavallo: le zampe davanti stanno sul numero della casella
    const cw = (W * 0.96) / (n + 1.85), x0 = W * 0.01 + 1.85 * cw;
    const hb = Math.max(2.6 * r, Math.min(H * 0.16, 6.4 * r)), fondo = H - 3.5 * r, cima = fondo - hb, yb = cima + hb * 0.36;
    const rapp = RAPP_CAV[opz.casata] || 1.2, sopra = Math.max(40, yb - 4.4 * r);
    const cavW = Math.max(56, Math.min(cw * 2.8, rapp * sopra / 1.62, W * 0.3)), cavH = cavW / rapp;
    return { W, H, r, n, x0, cw, hb, cima, yb, cavW, cavH, cx: k => x0 + (k + 0.5) * cw };
  }
  const xCav = k => geo.cx(k) + geo.cw * 0.5 - geo.cavW, yCav = () => geo.yb - geo.cavH * 0.95;      // il muso arriva al bordo destro della casella
  function metti(k) { pos = k; if (cav) cav.style.transform = `translate(${xCav(k)}px,${yCav()}px)`; }

  function disegna() {
    geo = misura();
    piano.innerHTML = '';
    const g = geo, banda = el('div', 'c-pista');
    banda.style.cssText = `left:${g.x0}px;width:${g.cw * g.n}px;top:${g.cima}px;height:${g.hb}px;--num:${Math.max(10, Math.min(g.cw * 0.4, 1.5 * g.r))}px`;
    for (let k = 0; k <= pista.len; k++) {
      const c = el('div', 'c-cella' + (k === 0 ? ' via' : k === pista.len ? ' fine' : ''), k === 0 ? 'VIA' : String(k));
      c.style.cssText = `left:${k * g.cw}px;width:${g.cw}px`; c.dataset.k = k;
      banda.appendChild(c);
    }
    piano.appendChild(banda);
    // bandiera del traguardo
    const bh = g.cavH * 0.95, band = el('div', 'c-bandiera', `<svg viewBox="0 0 40 100" width="${bh * 0.4}" height="${bh}"><rect x="4" y="2" width="4" height="98" rx="2" fill="#5A3716"/><path d="M8 5h28l-7 10 7 10H8z" fill="#fff" stroke="#2B2118" stroke-width="1.500"/><path d="M8 5h9v10H8zM17 15h9.500l2.500-3.600V15zM8 15h9v10H8z" fill="#2B2118" opacity=".9"/></svg>`);
    band.style.cssText = `left:${g.cx(pista.len) + g.cw * 0.52}px;top:${g.yb - bh}px`;
    piano.appendChild(band);
    // ostacoli
    Object.keys(pista.ost).forEach(k => {
      const h = pista.ost[k], o = OST[h];
      let alt = g.cavH * o.alt, larg = alt * o.rapp;
      if (larg > g.cw * 1.35) { larg = g.cw * 1.35; alt = larg / o.rapp; }
      const d = el('div', 'c-ost', `<span class="segno">${pallini(h)}</span><img src="img/${o.img}.webp" alt="${o.nome}">`);
      d.dataset.k = k; d.style.cssText = `left:${g.cx(+k) - larg / 2}px;top:${g.yb + g.hb * 0.1 - alt}px;width:${larg}px`;
      if (opz.stato && opz.stato[k]) d.classList.add(opz.stato[k]);
      piano.appendChild(d);
    });
    // cavaliere
    cav = el('div', 'c-cav', `<div class="salto"><div class="corpo-c"><img src="img/cav-${opz.casata}.webp" alt="Il tuo cavaliere"></div></div><div class="c-ombra"></div>`);
    cav.style.width = g.cavW + 'px';
    piano.appendChild(cav); metti(pos);
    if (opz.coperta) copri();
  }
  function copri() {
    const f = opz.coperta, nomi = { b: 'tronchi', m: 'barriere', a: 'muri' };
    const v = el('div', 'c-coperta', `<div class="scheda pergamena"><h3>${ico('sorpresa')} ${esc(opz.copertaNome || 'Manche a sorpresa')}</h3><p>Il giudice la svela solo alla partenza. Le sue regole:</p><ul>
      <li>${ico('avanza')}pista da ${f.len[0]} a ${f.len[1]} caselle</li>
      <li>${ico('salto')}da ${f.ost[0]} a ${f.ost[1]} ostacoli: ${[...f.alt].map(c => nomi[c]).join(', ')}</li>
      ${f.e != null ? `<li>${ico('energia')}energia ${f.e === 0 ? 'giusta per i salti esatti' : 'con ' + f.e + ' di margine'}</li>` : ''}${f.e0 != null ? `<li>${ico('energia')}si parte con ${f.e0} di energia su ${f.emax}</li>` : ''}${f.t != null ? `<li>${ico('tempo')}tempo contato</li>` : ''}</ul></div>`);

  }
  // mostra una pista: o = {sfondo, casata, energia:'carote'|'barra', coperta:famiglia, copertaNome}
  function mostra(p, o) {
    ferma();

    sfondo.style.backgroundImage = `url(img/${o.sfondo}.webp)`;

  }
  function scopri() { opz.coperta = null; $$('.c-coperta', piano).forEach(v => v.remove()); }
  function azzera() { ferma(); opz.stato = {}; pos = 0; disegna(); misure({ energia: pista.e0, pen: 0, tempo: 0 }); }

  function consegna(tipo, frase, o) {
    o = o || {};
    cart.innerHTML = `<span class="tipo">${ico(TIPI[tipo].ico)}${o.soloIcona ? '' : TIPI[tipo].nome}</span><span class="frase">${esc(frase)}</span>${o.ascolta && Voce.c_e() ? `<button class="ascolta" id="b-ascolta" aria-label="Ascolta la consegna">${ico('suono')}</button>` : ''}`;
    const b = $('#b-ascolta', cart); if (b) b.onclick = () => Voce.leggi(frase, b);
  }
  function misure(s) {
    const e = $('#hud-energia'), p = $('#hud-pen'), t = $('#hud-tempo');
    if (pista.e0 == null) e.hidden = true;
    else {
      e.hidden = false; e.classList.toggle('allerta', s.energia === 0);
      if (opz.energia === 'carote') e.innerHTML = `<div class="carote" aria-label="Energia ${s.energia} su ${pista.emax}">${Array.from({ length: pista.emax }, (_, i) => CAROTA(i < s.energia ? '' : 'usata')).join('')}</div>`;
      else e.innerHTML = `${ico('energia')}<div class="barra-e"><i style="width:${100 * s.energia / pista.emax}%"></i></div><span>${s.energia}/${pista.emax}</span>`;
    }
    p.hidden = !s.pen; p.classList.add('allerta'); p.innerHTML = `${ico('penalita')}<span>${s.pen} penalità</span>`;
    if (pista.tmax == null) t.hidden = true; else { t.hidden = false; t.classList.toggle('allerta', s.tempo > pista.tmax); t.innerHTML = `${ico('tempo')}<span>${s.tempo}/${pista.tmax}</span>`; }
  }
  function manche(lista, attiva, alTocco) {
    const box = $('#hud-manche'); box.hidden = lista.length < 2; box.innerHTML = '';
    lista.forEach((m, i) => {
      const st = m.st || '';
      const b = el('button', i === attiva ? 'si' : '', `${m.sorpresa ? ico('sorpresa', 'st') : st === 'ok' ? ico('ok', 'st') : st ? ico('no', 'st') : ''}<span>${esc(m.sorpresa ? m.nome : 'Manche ' + m.nome)}</span>`);
      b.dataset.st = st; b.onclick = () => alTocco(i); box.appendChild(b);
    });
  }

  // ---------- animazioni
  function ferma() { vivo++; attese.forEach(a => { try { a.cancel(); } catch (e) {} }); attese = []; $$('.c-bolla,.c-polvere,.c-scintilla', piano || document).forEach(x => x.remove()); if (cav) cav.classList.remove('galoppa', 'impunta', 'stanco', 'fuori'); }
  // in una scheda in secondo piano le animazioni possono non avanzare: un timer fa da paracadute, così la corsa non resta appesa
  function anima(elemento, fot, o) { const a = elemento.animate(fot, o); attese.push(a); return Promise.race([a.finished.catch(() => {}), attendi((o.duration || 0) + 120)]); }
  function polvere(k) { if (MOTO_RIDOTTO) return; const d = el('div', 'c-polvere'); d.style.cssText = `left:${geo.cx(k) - geo.cavW * 0.55}px;top:${geo.yb - 6}px`; piano.appendChild(d); setTimeout(() => d.remove(), 650); }
  function bolla(testo, o) {
    o = o || {};
    const b = el('div', 'c-bolla ' + (o.classe || ''), (o.icona ? ico(o.icona) : '') + `<span>${esc(testo)}</span>`);
    const k = o.cella != null ? o.cella : pos, x = Math.max(geo.W * 0.12, Math.min(geo.W * 0.88, geo.cx(k)));
    b.style.cssText = `left:${x}px;top:${Math.max(4.6 * geo.r + 30, geo.yb - geo.cavH * 1.02)}px`;
    piano.appendChild(b);
    if (o.durata) setTimeout(() => b.remove(), o.durata);
    return b;
  }
  function scintille(k) {
    if (MOTO_RIDOTTO) return;
    for (let i = 0; i < 14; i++) { const s = el('div', 'c-scintilla'), a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 90; s.style.cssText = `left:${geo.cx(k)}px;top:${geo.yb - geo.cavH * 0.5}px;--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d - 40}px;animation-delay:${i * 25}ms`; piano.appendChild(s); setTimeout(() => s.remove(), 1400); }
  }
  const ostEl = k => $(`.c-ost[data-k="${k}"]`, piano);

  // riproduce i fotogrammi. o.vel() velocità corrente, o.prima(f) chiamata prima di ogni fotogramma (evidenzia, passo-passo)
  async function riproduci(frames, o) {
    const io = ++vivo, v = () => (o.vel ? o.vel() : 1), vivoIo = () => io === vivo;
    for (const f of frames) {
      if (!vivoIo()) return false;
      if (o.prima) { await o.prima(f); if (!vivoIo()) return false; }
      if (f.tipo === 'passo') {
        cav.classList.add('galoppa'); Suoni.zoccoli(); polvere(f.da);
        await anima(cav, [{ transform: `translate(${xCav(f.da)}px,${yCav()}px)` }, { transform: `translate(${xCav(f.a)}px,${yCav()}px)` }], { duration: DURATE.passo / v(), easing: 'linear' });
        if (!vivoIo()) return false; metti(f.a); cav.classList.remove('galoppa');
      } else if (f.tipo === 'salto') {
        const d = DURATE.salto / v(), su = geo.cavH * 0.52, oe = ostEl(f.cella);
        Suoni.salto(); polvere(f.da);
        anima($('.salto', cav), [{ transform: 'translateY(0)', easing: 'cubic-bezier(.2,.7,.4,1)' }, { transform: `translateY(${-su}px)`, offset: 0.5, easing: 'cubic-bezier(.6,0,.8,.3)' }, { transform: 'translateY(0)' }], { duration: d });
        anima($('.corpo-c', cav), [{ transform: 'rotate(0)' }, { transform: 'rotate(-13deg)', offset: 0.3 }, { transform: 'rotate(4deg)', offset: 0.75 }, { transform: 'rotate(0)' }], { duration: d });
        if (f.esito === 'abbattuto') setTimeout(() => { if (vivoIo() && oe) { oe.classList.add('abbattuto'); opz.stato[f.cella] = 'abbattuto'; Suoni.abbattuto(); bolla(f.breve, { cella: f.cella, icona: 'penalita', durata: 1500 / v() + 500 }); } }, d * 0.5);
        await anima(cav, [{ transform: `translate(${xCav(f.da)}px,${yCav()}px)` }, { transform: `translate(${xCav(f.a)}px,${yCav()}px)` }], { duration: d, easing: 'linear' });
        if (!vivoIo()) return false; metti(f.a); Suoni.atterra(); polvere(f.a);
        if (f.esito === 'netto' && oe) { oe.classList.add('netto'); opz.stato[f.cella] = 'netto'; }
      } else if (f.tipo === 'riposa') {
        Suoni.riposa(); bolla('+1', { classe: 'buona', icona: 'energia', durata: DURATE.riposa / v() + 250 });
        await attendi(DURATE.riposa / v());
      } else if (f.tipo === 'annuncia') {
        Suoni.annuncia(); bolla(String(f.v), { classe: 'detto', icona: 'bandiera', durata: DURATE.annuncia / v() + 300 });
        await attendi(DURATE.annuncia / v());
      } else if (f.tipo === 'fine') {
        const t = f.fine.tipo;
        if (t === 'traguardo') { Suoni.traguardo(); scintille(pista.len); await attendi(700 / v()); }
        else {
          if (t === 'rifiuto' || t === 'vuoto') { cav.classList.add('impunta'); Suoni.impunta(); }
          else if (t === 'stanco') { cav.classList.add('stanco'); Suoni.impunta(); }
          else if (t === 'fuori') { Suoni.no(); await anima(cav, [{ transform: `translate(${xCav(pos)}px,${yCav()}px)` }, { transform: `translate(${geo.W + 20}px,${yCav()}px)` }], { duration: 600 / v(), easing: 'ease-in' }); if (vivoIo()) cav.classList.add('fuori'); }
          else Suoni.no();
          if (!vivoIo()) return false;
          bolla(f.fine.breve || 'FERMO', { icona: 'no', cella: t === 'fuori' ? pista.len : pos });
          await attendi(600 / v());

      if (!vivoIo()) return false;

    return true;
  }
  // Prevedi: lo studente tocca la casella dove secondo lui si fermerà il cavallo
  function chiediCasella(alTocco) {       // si può cambiare idea: ogni tocco aggiorna la previsione
    const banda = $('.c-pista', piano); banda.classList.add('si-tocca');
    $$('.c-cella', banda).forEach(c => c.onclick = () => { $$('.c-cella', banda).forEach(x => x.classList.toggle('scelta', x === c)); Suoni.click(); alTocco(+c.dataset.k); });
  }
  function segna(k) { $$('.c-cella', piano).forEach(c => c.classList.toggle('qui', k != null && +c.dataset.k === k)); }
  return { monta, mostra, scopri, azzera, consegna, misure, manche, riproduci, ferma, bolla, chiediCasella, segna, get pista() { return pista; } };
})();

// la consegna letta ad alta voce (percorsi 1-3): sintesi vocale del browser, nessun file audio
const Voce = (() => {
  let voce = null;
  function cerca() { if (!('speechSynthesis' in window)) return; const v = speechSynthesis.getVoices().filter(x => /^it/i.test(x.lang)); voce = v.find(x => /alice|federica|emma/i.test(x.name)) || v[0] || null; }
  if ('speechSynthesis' in window) { cerca(); speechSynthesis.addEventListener('voiceschanged', cerca); }
  return {
    c_e() { return !!voce; },
    leggi(testo, bottone) {
      if (!voce) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(testo.toLowerCase()); u.voice = voce; u.lang = 'it-IT'; u.rate = 0.9;
      if (bottone) { bottone.classList.add('parla'); u.onend = u.onerror = () => bottone.classList.remove('parla'); }
      speechSynthesis.speak(u);
    },
    taci() { if ('speechSynthesis' in window) speechSynthesis.cancel(); }
  };
})();

// ============================================================ EDITOR AD ALBERO (tessere e mattoncini)
// Un solo editor per i percorsi 1-6: l'albero è quello del motore, cambia solo la «pelle» CSS (data-pelle).
// Trascinamento con Pointer Events ascoltati su window (soluzione ereditata da Controcorrente e Coach!)
// più tocco per aggiungere nel punto di inserimento. I buchi dei livelli «Completa» si riempiono per primi.
const Editor = (() => {
  const MAX_NIDO = 4;
  const POT = { b: { k: 'num', v: 1, sim: 'BASSA' }, m: { k: 'num', v: 2, sim: 'MEDIA' }, a: { k: 'num', v: 3, sim: 'ALTA' }, H: { k: 'sens', nome: 'altezza' } };
  const POT_TXT = { b: 'bassa', m: 'media', a: 'alta', H: 'altezza dell\'ostacolo' };
  const COND = { ost: { k: 'sens', nome: 'ostacolo_davanti' }, b: null, m: null, a: null };
  ['b', 'm', 'a'].forEach(c => { COND[c] = { k: 'op', op: '==', a: { k: 'sens', nome: 'altezza' }, b: POT[c] }; });
  const COND_TXT = { ost: 'ostacolo davanti', b: 'ostacolo BASSO davanti', m: 'ostacolo MEDIO davanti', a: 'ostacolo ALTO davanti' };
  const copia = o => JSON.parse(JSON.stringify(o));
  const chiavePot = e => !e || e.k === 'buco' ? null : e.k === 'sens' ? 'H' : 'bma'[e.v - 1];
  const chiaveCond = e => !e || e.k === 'buco' ? null : e.k === 'sens' ? 'ost' : 'bma'[e.b.v - 1];
  const CAT = { avanza: 'mov', salta: 'salti', ripeti: 'cicli', finche: 'cicli', se: 'ctrl', buco: 'buco' };
  const GRUPPI = [['mov', 'Movimento', 'avanza', ['passo', 'avanza']], ['salti', 'Salti', 'salto', ['salto', 'salta']], ['cicli', 'Cicli', 'ripeti', ['ripeti', 'finche']], ['ctrl', 'Controllo', 'se', ['se', 'sealt']]];
  let prog = [], liv = null, pelle = 'mattoncini', fermo = false, cursore = { cont: 0, ramo: 'body' }, alCambio = null, ultimo = 0, drag = null;
  const P = () => $('#programma');

  function nuovo(cmd) {
    const n = { id: IPPO.nuovoId() };
    if (cmd === 'passo' || cmd === 'avanza') return Object.assign(n, { t: 'avanza', n: { k: 'num', v: 1 } });
    if (cmd === 'salto') return Object.assign(n, { t: 'salta', p: copia(POT.b) });
    if (cmd === 'salta') return Object.assign(n, { t: 'salta', p: copia(POT[liv.pot[0]]) });
    if (cmd === 'ripeti') return Object.assign(n, { t: 'ripeti', n: { k: 'num', v: 3 }, body: [] });
    if (cmd === 'finche') return Object.assign(n, { t: 'finche', c: { k: 'not', a: { k: 'sens', nome: 'traguardo' } }, body: [] });
    return Object.assign(n, { t: 'se', c: copia(COND[liv.cond[0]]), body: [], alt: cmd === 'sealt' ? [] : null });
  }
  // ricerca nell'albero: restituisce la lista che contiene il nodo, la posizione e il contenitore
  function trova(id, lista, padre, ramo) {
    lista = lista || prog;
    for (let i = 0; i < lista.length; i++) {
      const n = lista[i];
      if (n.id === id) return { lista, idx: i, nodo: n, padre: padre || null, ramo: ramo || 'body' };
      for (const r of ['body', 'alt']) if (n[r]) { const x = trova(id, n[r], n, r); if (x) return x; }
    }
    return null;
  }
  const listaDi = (cont, ramo) => { if (!cont) return prog; const r = trova(cont); return r ? r.nodo[ramo] || null : null; };
  const profonditaDi = cont => { let d = 0, r = cont ? trova(cont) : null; while (r) { d++; r = r.padre ? trova(r.padre.id) : null; } return d; };
  const altezza = n => (n.body || n.alt) ? 1 + Math.max(0, ...(n.body || []).map(altezza), ...(n.alt || []).map(altezza)) : 0;
  const contiene = (n, id) => ['body', 'alt'].some(r => (n[r] || []).some(b => b.id === id || contiene(b, id)));
  function primoBuco(lista) { for (const n of lista) { if (n.t === 'buco') return n; for (const r of ['body', 'alt']) if (n[r]) { const x = primoBuco(n[r]); if (x) return x; } } return null; }

  // ---------- rendering
  function contatore(nodo, campo, min, max) {
    const e = nodo[campo], buco = e.k === 'buco';
    const c = el('span', 'contan' + (buco ? ' buco' : '')), meno = el('button', null, '−'), val = el('span', 'conto', buco ? '?' : e.v), piu = el('button', null, '+');
    meno.setAttribute('aria-label', 'meno'); piu.setAttribute('aria-label', 'più');
    const metti = v => { if (fermo) return; nodo[campo] = { k: 'num', v: Math.max(min, Math.min(max, v)) }; Suoni.click(); cambiato(); };
    meno.onclick = ev => { ev.stopPropagation(); metti(buco ? min : e.v - 1); };
    piu.onclick = ev => { ev.stopPropagation(); metti(buco ? min : e.v + 1); };
    c.append(meno, val, piu); return c;
  }
