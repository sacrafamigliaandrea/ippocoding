        <div class="traguardo ${st.t ? 'si' : ''}">${ico('stella', 'stella ' + (st.t ? 'si' : ''))}<div><b>${piccoli() ? 'TRAGUARDO' : corse.length > 1 ? 'Traguardo in tutte le manche' : 'Traguardo'}</b></div></div>
        <div class="traguardo ${st.n ? 'si' : ''}">${ico('stella', 'stella ' + (st.n ? 'si' : ''))}<div><b>${piccoli() ? 'PERCORSO NETTO' : 'Percorso netto'}</b>${st.n || piccoli() ? '' : `<small>${esc(primaPenalita(corse) || pen + ' penalità')}</small>`}</div></div>
        <div class="traguardo ${st.p ? 'si' : ''}">${ico('stella', 'stella ' + (st.p ? 'si' : ''))}<div><b>${piccoli() ? 'POCHE TESSERE' : `Al massimo ${liv.par} ${parola}`}</b>${st.p || piccoli() ? '' : `<small>${st.n ? `Ne hai usati ${v.blocchi}: c'è un modo più corto.` : 'Vale solo su un percorso netto.'}</small>`}</div></div></div>`;
    const tutte = ora.t && ora.n && ora.p, cod = l < 10 ? IPPO.codice(p, l + 1) : '';
    const titolo = tipo === 'osserva' ? (piccoli() ? 'VISTO!' : 'Osservazione completata') : tipo === 'prevedi' ? 'Previsione giusta' : l === 10 ? 'Prova superata' : piccoli() ? 'TRAGUARDO!' : st.p ? 'Tre stelle' : st.n ? 'Percorso netto' : 'Traguardo';
    const ov = apriOv('ov-vittoria', `<div class="scheda pergamena vittoria su-carta"><h2>${esc(titolo)}</h2>
      ${tipo === 'prevedi' ? '<p>Hai letto il codice e previsto che cosa avrebbe fatto il cavallo: è così che si controlla un programma prima di eseguirlo.</p>' : ''}
      <div style="display:flex;justify-content:center;margin:.6rem 0;font-size:1.6rem">${stelline(ora).replace(/class="stella/g, 'style="width:3.2rem;height:3.2rem" class="stella')}</div>${righe}
      ${cod && !(Registro.attivo() && STATO.chi && Registro.stato !== 'rete' && Registro.stato !== 'errore') ? `<div class="codice-gara"><span>Codice gara per il livello ${l + 1}</span><b>${cod}</b><small>Segnatelo: serve per riprendere da qui un altro giorno.</small></div>` : (Registro.attivo() && STATO.chi ? `<p><small>${esc(Registro.frase())}</small></p>` : '')}
      <div class="azioni">${tutte || tipo === 'osserva' || tipo === 'prevedi' ? '' : `<button class="btn carta" id="v-riprova">${ico('ricomincia')}${piccoli() ? '' : 'Miglioro'}</button>`}<button class="btn carta" id="v-stalla">${ico('sx')}${piccoli() ? '' : 'Stalla'}</button><button class="btn oro" id="v-avanti">${ico('dx')}${piccoli() ? 'AVANTI' : l < 10 ? 'Livello ' + (l + 1) : 'Al castello'}</button></div></div>`);
    const chiudi = () => ov.remove();
    const br = $('#v-riprova', ov); if (br) br.onclick = () => { chiudi(); Campo.azzera(); avviso('', '', st.n ? `Ora prova a farlo stare in ${liv.par} ${parola}.` : 'Ora cerca il percorso netto: nessuna penalità.'); };
    $('#v-stalla', ov).onclick = () => { chiudi(); vaiStalla(p); };
    $('#v-avanti', ov).onclick = async () => {
      chiudi();
      if (l === 5 && primaVolta) await scena({ img: 'scena-campo', titolo: 'Si esce in campo', testo: STORIA[p].meta });
      if (l < 10) return apri(p, l + 1);
      if (primaVolta) { Musica.fanfara(); await scena({ img: p === 8 ? 'finale' : 'castello', titolo: `Hai il grado di ${PERCORSI[p].grado}`, testo: STORIA[p].chiude }); await debrief(p); }
      vaiCastello();
    };
    $('#v-avanti', ov).focus();
  }
  function debrief(p) {
    return new Promise(fatto => {
      const ov = apriOv('ov-debrief', `<div class="scheda pergamena debrief" style="width:min(92vw,42rem)"><h2>Prima di andare</h2><p>${p <= 2 ? 'Una domanda da fare insieme, a voce:' : 'Una domanda su cui ragionare, a voce con la classe o sul quaderno:'}</p><div class="domanda">${esc(STORIA[p].debrief)}</div><div class="azioni"><button class="btn oro" id="deb-ok">${ico('dx')}Fatto</button></div></div>`);
      $('#deb-ok', ov).onclick = () => { ov.remove(); fatto(); };
    });
  }

  // ---------- aiuti e novità
  function aiuto() {
    if (inCorsa) return;
    Suoni.click();
    if (fermoPerTipo()) return avviso('', 'Che cosa fare', liv.k === 'osserva' ? 'premi ESEGUI e guarda che cosa fa il cavallo, mattoncino per mattoncino.' : 'leggi il programma riga per riga seguendo il cavallo con il dito sulla pista, poi fai la tua previsione.');
    if (piccoli()) {            // chi non legge: l'aiuto si vede, non si legge
      aiuti = Math.min(2, aiuti + 1);
      if (!Editor.aiutoVisivo(IPPO.parse(liv.sol).ast, aiuti, lista[0].pista)) Campo.bolla('PREMI VIA', { icona: 'play', classe: 'buona', durata: 1800 });
      return;
    }
    aiuti = Math.min(2, aiuti + 1);
    const ov = apriOv('ov-aiuto', `<div class="scheda pergamena aiuto"><h2>${ico('lampadina')} Aiuto</h2>
      ${liv.a.slice(0, aiuti).map((t, i) => `<div class="passo-a"><b>${i + 1}.</b><span>${esc(t)}</span></div>`).join('')}
      <div class="azioni">${aiuti < 2 ? `<button class="btn carta" id="a-altro">Un altro aiuto</button>` : ''}<button class="btn oro" id="a-ok">Ho capito</button></div></div>`);
    $('#a-ok', ov).onclick = () => ov.remove();
    const b = $('#a-altro', ov); if (b) b.onclick = () => { ov.remove(); aiuto(); };
  }
  function novita(chiave) {
    const N = NOVITA[chiave]; if (!N) return;
    const cavallo = `<img class="d-cav" src="img/cav-${STATO.casata}.webp" alt="">`;
    const ov = apriOv('ov-novita', `<div class="scheda pergamena novita"><span class="etichetta">novità</span><h2 style="margin-top:.4rem">${esc(N.t)}</h2>${N.d ? `<p>${esc(N.d)}</p>` : ''}
      <div class="mostra" id="nov-mostra">${N.demo ? `<div class="demo ${N.demo}">${cavallo}${N.demo === 'salto' ? '<img class="d-ost" src="img/ost-tronco.webp" alt="">' : ''}</div>` : ''}</div>
      <div class="azioni"><button class="btn oro" id="nov-ok">${ico('dx')}${liv.forma === 'tessere' ? 'VIA' : 'Ho capito'}</button></div></div>`);
    const mostraBox = $('#nov-mostra', ov);
    if (N.bl) mostraBox.append(Editor.figura(IPPO.parse(cod(N.bl)).ast, liv, liv.forma === 'tessere' ? 'tessere' : 'mattoncini'));   // disegnati dallo stesso editor
    if (N.py) { if (N.bl) mostraBox.append(el('span', 'uguale', '=')); mostraBox.append(el('pre', null, cod(N.py).split('\n').map(coloraPy).join('\n'))); }
    if (N.carote) mostraBox.append(el('div', 'carote', [1, 2, 3].map(n => `<span style="display:inline-flex;align-items:center;margin-right:.6rem">${pallini(n)}&nbsp;=&nbsp;${CAROTA().repeat(n)}</span>`).join('')));
    if (!mostraBox.children.length) mostraBox.remove();
    $('#nov-ok', ov).onclick = () => { Suoni.click(); ov.remove(); };
    $('#nov-ok', ov).focus();
  }
  return { apri, esegui, stop, aiuto, avviso, get livello() { return liv; } };
})();

// ============================================================ DOCENTE
// Cinque tocchi sul logo: tutti i livelli aperti, pulsante Soluzione, prova del collegamento al foglio.
function modalitaDocente() {
  STATO.docente = !STATO.docente; aggiornaChip(); Suoni.stella();
  if (!STATO.docente) return;
  const ov = apriOv('ov-docente', `<div class="scheda pergamena docente"><h2>Modalità docente</h2>
    <ul><li>Tutti i livelli sono aperti, in tutti i percorsi.</li><li>In ogni livello compare il pulsante <b>Soluzione</b>.</li><li>Link diretto a un livello: <code>?percorso=4&amp;livello=7</code>. Stesse manche a sorpresa per tutta la classe: <code>?seed=4A-martedi</code>.</li><li>Altri parametri: <code>?musica=0</code>, <code>?suoni=0</code>, <code>?registro=0</code>.</li></ul>
    <h3>Progressi per classe e Mac</h3>
    <p>${Registro.attivo() ? 'Il foglio della scuola è collegato: si salvano classe, Mac e stelle, mai un nome.' : 'Il foglio della scuola non è collegato (REGISTRO_URL è vuoto in index.html): le stelle restano nella scheda del browser e per riprendere serve il codice gara. Le istruzioni per collegarlo sono nella scheda docenti.'}</p>
    <div class="azioni" style="justify-content:flex-start">${Registro.attivo() ? '<button class="btn piccolo" id="doc-prova">Prova il collegamento al foglio</button><span id="doc-esito"></span>' : ''}<a class="btn piccolo carta" href="ippo-docenti.html" target="_blank" rel="noopener">${ico('libro')}Scheda docenti</a><button class="btn oro" id="doc-ok">Chiudi</button></div></div>`);
  $('#doc-ok', ov).onclick = () => { ov.remove(); if (schermo === 's-castello') vaiCastello(); else if (schermo === 's-stalla') vaiStalla(STATO.percorso); };
  const b = $('#doc-prova', ov);
  if (b) b.onclick = async () => { const e = $('#doc-esito', ov); e.textContent = 'Provo...'; try { const d = await Registro.chiama({ a: 'prova' }); e.textContent = d.ok && d.ippo ? 'Collegamento riuscito.' : 'Il foglio risponde, ma non con lo script di Ippo Coding: controlla il deployment.'; } catch (err) { e.textContent = 'Il foglio non risponde: controlla l\'indirizzo e il deployment.'; } };
}
function cinqueTocchi(elemento) {
  let n = 0, t = 0;
  elemento.addEventListener('click', () => { const ora = Date.now(); n = ora - t < 700 ? n + 1 : 1; t = ora; if (n >= 5) { n = 0; modalitaDocente(); } });
}

// ============================================================ AVVIO
function avvia() {
  ripresa(); impostaCasata(STATO.casata); aggiornaAudio();
  $$('.b-suoni').forEach(b => b.onclick = () => { Suoni.cambia(); aggiornaAudio(); });
  $$('.b-musica').forEach(b => b.onclick = () => { Musica.cambia(); aggiornaAudio(); });
  $('#b-aiuto').innerHTML = ico('aiuto'); $('#b-aiuto').onclick = () => Gioco.aiuto();
  $('#b-indietro').innerHTML = ico('sx');
  $('#b-indietro').onclick = () => { Suoni.click(); Voce.taci(); if (schermo === 's-gara') { Gioco.stop(false); vaiStalla(STATO.percorso); } else if (schermo === 's-stalla') vaiCastello(); else mostra('s-titolo'); };
  $('#chi-chip').onclick = () => { if (schermo === 's-gara') return; mostra('s-titolo'); chiediChi(vaiCastello); };
  $('#chi-chip').style.cursor = 'pointer'; $('#chi-chip').title = 'Cambia classe e Mac';
  $('#b-gioca').textContent = 'GIOCA';
  $('#b-gioca').onclick = () => { Suoni.pop(); if (STATO.chi || STATO.senza) vaiCastello(); else chiediChi(vaiCastello); };
  cinqueTocchi($('#zona-logo')); cinqueTocchi($('#marchio'));
  window.addEventListener('keydown', e => { if (e.key === 'Escape') ['ov-aiuto', 'ov-docente'].forEach(chiudiOv); });
  // link diretto del docente: ?percorso=N&livello=M apre subito un livello, senza chiedere chi sei
  const dp = +PAR.get('percorso'), dl = +PAR.get('livello') || 1;
  if (dp >= 1 && dp <= 8 && dl >= 1 && dl <= 10) { if (!STATO.chi) STATO.senza = true; STATO.aperti[dp] = Math.max(STATO.aperti[dp], dl); Gioco.apri(dp, dl); }
  else mostra('s-titolo');
}
avvia();
/*APP*/
</script>
